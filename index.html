<style>:root{--ink:#1d2340;--muted:#5b6385;--card:#ffffff;--bg:#141a33;--accent:#7b5cff;--good:#2fa86a;--bad:#d64550;--warn:#f0a020;--blue:#2f80ed;--purple:#7b5cff;--gold:#e0a400;--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);overscroll-behavior:none}
body.big{font-size:18px}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:2.5px solid #2a2238;border-radius:14px;padding:10px 14px;font-weight:800;color:#fff;background:var(--accent);box-shadow:0 4px 0 #2a2238;transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a2238}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#eef0fa;color:var(--ink)}
button.good{background:var(--good)}button.bad{background:var(--bad)}button.gold{background:var(--gold);color:#2a1d00}button.blue{background:var(--blue)}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;background:linear-gradient(#0d1230ee,#0d123000);color:#fff;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .who{display:flex;flex-direction:column;min-width:0;flex:1}
#hud .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .rk{font-size:11px;opacity:.85}
.xpbar{height:8px;background:#ffffff33;border-radius:8px;overflow:hidden;margin-top:3px;max-width:220px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd54a,#ff8a3d);width:0;transition:width .5s}
.chip{background:#ffffff22;border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.hbtn{background:#ffffff22;padding:8px 10px;font-size:16px;box-shadow:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);background:#0d1230dd;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:5;max-width:92vw;text-align:center;pointer-events:none}
/* Screens */
.screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;overflow:auto;-webkit-overflow-scrolling:touch}
#start{background:radial-gradient(circle at 50% 20%,#3b2b8f,#141a33 70%);color:#fff;justify-content:center;padding:24px;text-align:center}
#start h1{font-size:clamp(30px,8vw,60px);margin:6px 0;letter-spacing:2px;text-shadow:0 4px 0 #e8505b,0 8px 0 #0008;line-height:1.05}
#start h2{font-size:clamp(14px,4vw,20px);margin:0 0 18px;color:#ffd54a;letter-spacing:3px}
#start .btns{display:flex;flex-direction:column;gap:10px;width:min(320px,90vw)}
#start .btns button{font-size:18px;padding:14px}
#start .disc{font-size:11px;opacity:.7;max-width:480px;margin-top:18px}
#startCanvas{width:260px;height:120px}
.pulse{animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:scale(1.05)}}
/* Creator */
#create{background:#f5f3ff;padding:calc(env(safe-area-inset-top) + 10px) 12px 24px}
#create .wrap{width:min(900px,100%);display:grid;grid-template-columns:260px 1fr;gap:14px}
@media(max-width:700px){#create .wrap{grid-template-columns:1fr}}
#create .prev{background:linear-gradient(#cfe8ff,#eaf4ff);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;padding:12px;position:sticky;top:0;z-index:2}
#create .prev canvas{width:160px;height:200px}
.opt-group{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:0 2px 0 #0001}
.opt-group h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ccd;position:relative;padding:0}
.sw.sel{box-shadow:0 0 0 3px var(--accent)}
.pill{background:#eef0fa;color:var(--ink);padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:none;position:relative}
.pill.sel{background:var(--accent);color:#fff}
.lock{position:absolute;top:-6px;right:-6px;background:#2a1d00;color:#ffd54a;font-size:10px;border-radius:999px;padding:2px 5px;white-space:nowrap}
#create input{font:inherit;padding:10px;border-radius:10px;border:2px solid #ccd;width:100%}
/* Question sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:84vh;z-index:20;display:flex;justify-content:center;pointer-events:none}
#sheet .card{pointer-events:auto;width:min(780px,100%);background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px #0006;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(env(safe-area-inset-bottom) + 18px);animation:up .3s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.qhead .tag{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;color:#fff;letter-spacing:.5px}
.qhead .sp{flex:1}
.qprog{height:6px;background:#eef0fa;border-radius:6px;margin-bottom:10px;overflow:hidden}.qprog i{display:block;height:100%;background:var(--accent)}
.mon{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;gap:6px;background:#0b1020;color:#8f8;border-radius:12px;padding:8px;font-family:ui-monospace,Menlo,monospace;margin-bottom:10px;align-items:center}
.mon div{font-size:11px;color:#9ab}.mon b{display:block;font-size:17px}
.mon .hr b{color:#4f8}.mon .bp b{color:#f66}.mon .sp b{color:#5cf}.mon .rr b{color:#fd5}
.mon.alarm{animation:alarm .6s infinite}@keyframes alarm{50%{background:#401018}}
.stab{height:10px;background:#333;border-radius:6px;overflow:hidden}.stab i{display:block;height:100%;transition:width .6s,background .6s}
.stem{font-size:1.06em;line-height:1.45;margin:6px 0 12px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#f4f5fb;color:var(--ink);border:2px solid #e2e5f3;border-radius:14px;padding:12px;font-weight:600;box-shadow:none;width:100%}
.opt .k{flex:0 0 26px;height:26px;border-radius:8px;background:#fff;border:2px solid #cfd3e6;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.opt.sel{border-color:var(--accent);background:#efeaff}.opt.sel .k{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.right{border-color:var(--good);background:#e7f7ee}.opt.wrong{border-color:var(--bad);background:#fdecee}
.opt.missed{border-style:dashed;border-color:var(--good)}
.qact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.qact .grow{flex:1}
.mx{width:100%;border-collapse:collapse;font-size:.95em}.mx th,.mx td{border-bottom:1px solid #e2e5f3;padding:8px 4px;text-align:center}.mx td:first-child{text-align:left;font-weight:600}
.mx input{width:22px;height:22px;accent-color:var(--accent)}
.mx tr.right td:first-child{color:var(--good)}.mx tr.wrong td:first-child{color:var(--bad)}
.cloze select{font:inherit;font-weight:700;padding:6px;border-radius:8px;border:2px solid var(--accent);background:#efeaff;max-width:100%;margin:2px 0}
.cloze select.right{border-color:var(--good);background:#e7f7ee}.cloze select.wrong{border-color:var(--bad);background:#fdecee}
/* Feedback */
.fb{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ban{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;color:#fff;font-weight:800}
.ban.ok{background:var(--good)}.ban.no{background:var(--bad)}
.ban canvas{width:48px;height:60px;flex:0 0 auto}
.ban.ok canvas{animation:hop .5s 2}.ban.no canvas{animation:shake .4s 2}
@keyframes hop{50%{transform:translateY(-10px)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.box{border-radius:14px;padding:10px 12px;font-size:.95em;line-height:1.45;border-left:6px solid}
.box h5{margin:0 0 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.trap{background:#fff5e0;border-color:#f0a020}.trap h5{color:#a35f00;font-size:14px}
.trap .tn{font-weight:800;color:#7a4500}
.ans{background:#e7f7ee;border-color:var(--good)}.clue{background:#e8f1fe;border-color:var(--blue)}.prin{background:#f0ebff;border-color:var(--purple)}
.strat{background:#e9f9f1;border-color:#1f9d63}.pearl{background:#fff8d6;border-color:var(--gold)}.test{background:#f3f4f8;border-color:#8a91b4}
details.why{background:#f7f7fb;border-radius:14px;padding:8px 12px}details.why summary{font-weight:800;cursor:pointer}
.why li{margin:6px 0}.why .ok{color:var(--good);font-weight:800}.why .no{color:var(--bad);font-weight:800}
.mini-btns{display:flex;gap:8px;flex-wrap:wrap}
.mini-btns button{font-size:13px;padding:8px 10px}
/* Modal */
#modal{position:fixed;inset:0;background:#0009;z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){#modal{align-items:center}}
#modal .mcard{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s}
@media(min-width:700px){#modal .mcard{border-radius:22px}}
.mcard h2{margin:0 0 8px}.mcard h3{margin:14px 0 6px}
.mhead{display:flex;align-items:center;gap:8px}.mhead h2{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:#f4f5fb;border-radius:14px;padding:10px}
.tile b{display:block;font-size:20px}
.bar{height:12px;background:#eef0fa;border-radius:8px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row .grow{flex:1}
.ach{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:#f4f5fb;margin:6px 0}.ach.off{opacity:.45;filter:grayscale(1)}.ach .ic{font-size:26px}
.flash{perspective:900px;margin:10px 0}
.fcard{position:relative;height:220px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.fcard>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:1.05em;line-height:1.4}
.fcard .f{background:linear-gradient(135deg,#7b5cff,#2f80ed);color:#fff}.fcard .b{background:#fff8d6;transform:rotateY(180deg);border:3px solid var(--gold)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:2px solid #dde;padding-top:6px}
.chart div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-width:6px}
.chart div span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}
.lesson .blk{border-radius:14px;padding:10px 12px;margin:8px 0;color:#fff}.lesson .blk b{display:block;letter-spacing:1px;font-size:13px}
.lesson .mn{background:#fff8d6;border:2px dashed var(--gold);border-radius:14px;padding:10px;font-weight:700}
/* Dialogue */
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(640px,94vw);background:#fffdf5;border:4px solid #1d2340;border-radius:16px;padding:12px 14px;z-index:25;box-shadow:0 6px 0 #0005}
#dlg .who{font-weight:900;color:var(--accent);margin-bottom:4px}
#dlg .txt{line-height:1.45}
#dlg .dact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
/* Toast */
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:94vw}
.toast{background:#1d2340;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:0 6px 18px #0006;animation:tin .35s ease-out;max-width:520px;text-align:center}
.toast.ach{background:linear-gradient(90deg,#e0a400,#ff8a3d);color:#2a1d00}
@keyframes tin{from{transform:translateY(-20px) scale(.9);opacity:0}}
/* Boss */
#boss{background:radial-gradient(circle at 70% 25%,#4a1c6b,#120a24 70%);color:#fff;z-index:28;justify-content:flex-start}
#boss .arena{position:relative;width:min(780px,100%);height:min(40vh,330px);flex:0 0 auto}
#boss .arena canvas{width:100%;height:100%}
#boss .bhud{width:min(780px,100%);padding:calc(env(safe-area-inset-top) + 8px) 12px 0}
#boss .bname{display:flex;justify-content:space-between;font-weight:900;letter-spacing:1px}
.hp{height:18px;background:#ffffff22;border-radius:10px;overflow:hidden;border:2px solid #fff6;margin-top:4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff3d5a,#ff9a3d);transition:width .5s}
.specials{display:flex;gap:6px;flex-wrap:wrap;width:min(780px,100%);padding:6px 12px}
.specials button{font-size:12px;padding:7px 9px;background:#ffffff22}
.specials button.ready{background:linear-gradient(90deg,#ffd54a,#ff8a3d);color:#2a1d00;animation:pulse 1.2s infinite}
.specials button.armed{background:#2fa86a;color:#fff}
#bossQ{width:min(780px,100%);flex:1 0 auto}
#bossQ .card{background:#fff;color:var(--ink);border-radius:22px 22px 0 0;padding:12px 14px calc(env(safe-area-inset-bottom) + 18px);min-height:100%}
.float{position:absolute;font-weight:900;font-size:30px;pointer-events:none;animation:floatup 1.2s ease-out forwards;text-shadow:0 3px 0 #000a}
@keyframes floatup{to{transform:translateY(-70px);opacity:0}}
body.rm *{animation:none!important;transition:none!important}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.small{font-size:12px;color:var(--muted)}
.kbd{font-family:ui-monospace,monospace;background:#eef0fa;padding:1px 6px;border-radius:6px}
textarea{width:100%;font:12px ui-monospace,monospace;border-radius:10px;border:2px solid #ccd;padding:8px}

#sheet.room{max-height:calc(100vh - 64px - env(safe-area-inset-top))}#sheet.room .card{max-height:calc(100vh - 64px - env(safe-area-inset-top));min-height:calc(100vh - 64px - env(safe-area-inset-top))}
#sheet .card{max-height:84vh}

.hbtn{border-color:transparent!important;box-shadow:none!important}
.opt{border-width:2.5px}.opt.sel{box-shadow:0 3px 0 #2a2238}
.sw{border:3px solid #fff!important;box-shadow:0 0 0 2px #2a2238!important}.sw.sel{box-shadow:0 0 0 4px var(--accent)!important}
.pill{border-width:2px}
#sheet .card,#modal .mcard{border:3px solid #2a2238;border-bottom:0}
@media(min-width:700px){#modal .mcard{border-bottom:3px solid #2a2238}}
.ban{border:2.5px solid #2a2238;box-shadow:0 4px 0 #2a2238}
#start h1{text-shadow:0 4px 0 #e8505b,0 8px 0 #2a2238,0 12px 24px #0008;-webkit-text-stroke:2px #2a2238}
#startCanvas{width:260px;height:120px}
.tstrip{background:linear-gradient(135deg,#efeaff,#e3f0ff);border:2.5px solid #2a2238;border-radius:14px;padding:8px 12px;margin-bottom:10px}
.tstrip .tt{display:flex;justify-content:space-between;gap:8px;font-weight:800;color:#3b2a9a}.tstrip .tt span{color:#2fa86a;white-space:nowrap}
.tstrip .tm{font-size:.88em;margin-top:4px;color:#1d2340}

.tipbox{position:fixed;left:calc(env(safe-area-inset-left) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(560px,calc(100vw - 20px));margin:0;background:#151a3dee;border:2px solid #ffffff30;border-radius:14px;padding:7px 9px;text-align:left;z-index:31;box-shadow:0 6px 18px #0007;display:flex;align-items:center;gap:10px}
.tipbox.hidden{display:none}
.tiptext{flex:1;min-width:0}
.tipbox p{margin:0;font-size:10.5px;line-height:1.3}.tipbox .t1{font-weight:700}.tipbox .t2{color:#ffe08a;font-size:12.5px;margin:0 0 2px}
.payrow{display:flex;gap:6px;flex:0 0 auto;margin:0}
.pay{width:50px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;background:var(--pc);color:var(--pt);border:2px solid #2a2238;box-shadow:0 3px 0 #2a2238;border-radius:10px;padding:4px 2px 3px;transition:transform .1s}
.pay:active{transform:translateY(3px);box-shadow:0 1px 0 #2a2238}
.pay .pl{font-size:16px;font-weight:900;line-height:1}.pay .pn{font-size:8.5px;font-weight:800}

#start.hastip{padding-bottom:96px}
.pay .pn{white-space:nowrap}


/* ---- Home screen: fits any window; scrolls instead of cutting off ---- */
#start{justify-content:flex-start;min-height:100%;padding-top:calc(env(safe-area-inset-top) + 16px)}
#start>:first-child{margin-top:auto}
#start #footDisc{margin-bottom:auto}
#startCanvas{width:min(300px,80vw);height:auto;aspect-ratio:520/240}
@media(max-height:780px){
  #startCanvas{width:min(240px,70vw)}
  #start h1{font-size:clamp(28px,min(7vw,7vh),48px)}
  #start h2{font-size:clamp(13px,min(3.6vw,2.6vh),18px);margin-bottom:12px}
  #start .btns{gap:8px}#start .btns button{padding:11px;font-size:16px}
  #start .disc{margin-top:10px}
}
@media(max-height:600px){
  #startCanvas{width:min(190px,60vw)}
  #start .btns button{padding:9px;font-size:15px}
}
@media(max-height:520px){#startCanvas{display:none}}
</style>

<body>
<canvas id="cv" aria-label="Hospital map. Tap a door to walk there."></canvas>

<div id="hud" class="hidden">
  <canvas id="hAv" width="40" height="56" style="width:40px;height:56px;cursor:pointer" title="Dashboard"></canvas>
  <div class="who"><div class="nm" id="hNm"></div><div class="xpbar"><i id="hXp"></i></div><div class="rk" id="hRk"></div></div>
  <span class="chip" id="hCoins"></span>
  <span class="chip hidden" id="hCloud" title="Cloud save"></span>
  <button class="hbtn" id="hVault" title="Missed question vault">🧠</button>
  <button class="hbtn" id="hSnd" title="Sound">🔊</button>
  <button class="hbtn" id="hMenu" title="Menu">☰</button>
</div>
<div id="hint" class="hidden"></div>

<div id="start" class="screen">
  <canvas id="startCanvas"></canvas>
  <h1>Med-Surg Heroes</h1>
  <h2>Nursing School Study Chronicles</h2>
  <div class="btns">
    <button class="good pulse hidden" id="quickCont"></button>
    <button class="good" id="btnPlay">▶ Play / New Game</button>
    <button class="blue hidden" id="btnAcct">☁️ Sign in to Save</button>
    <button class="ghost" id="btnHow">❓ How to Play</button>
  </div>
  <div id="tipBox" class="tipbox hidden">
    <div class="tiptext"><p class="t2"><b>💜 Fuel a Future Nurse</b></p>
    <p class="t1">Med-Surg Heroes is a free study game made for nursing students, by a nursing student. 💜</p></div>
    <div class="payrow" id="payRow"></div>
  </div>
  <p class="disc" id="cloudNote" style="color:#9fe8b8;opacity:1"></p>
  <p class="disc" id="footDisc">Not affiliated with or endorsed by Elsevier or HESI®.</p>
</div>

const TRAPS = {
  ASSESS:{n:"The 'Assess More' Trap",d:"Gathering more data feels safe, but when the cues already show danger, HESI wants you to ACT. Assess first only when you don't yet have enough information to act safely."},
  CHRONIC:{n:"The 'Scary Chronic' Trap",d:"Abnormal-but-baseline findings (a COPD patient's SpO2 of 90%, CKD labs, old edema) look alarming. HESI rewards you for spotting the NEW, ACUTE change."},
  DELEGATE:{n:"The Delegation Trap",d:"Assessment, teaching, evaluation, care planning and unstable patients stay with the RN. UAP = routine tasks on stable patients. LPN = stable, predictable patients and data collection."},
  CALL:{n:"The 'Call the Provider' Trap",d:"Calling is often right, but usually second. First do what the nurse can do independently right now to protect the patient (stop the infusion, position, oxygen, stay)."},
  COMFORT:{n:"The 'Comfort First' Trap",d:"Emotional support and comfort matter, but Maslow puts physiologic threats (airway, breathing, circulation) first."},
  TRUEBUT:{n:"The 'True but Not First' Trap",d:"This option is a correct nursing action, just not the FIRST or BEST one. Ask: 'What happens to the patient if I do this second?'"},
  NUMBER:{n:"The 'Dramatic Number' Trap",d:"The most dramatic-looking value isn't always the most dangerous. Compare each value to baseline and to what is expected for that condition."},
  LEAVE:{n:"The 'Leave the Patient' Trap",d:"Never leave an unstable patient to get equipment, chart, or make a call. Stay, call for help, and act."},
  EXPECT:{n:"The 'Expected Finding' Trap",d:"Many findings are expected for the condition or procedure. HESI is asking for the finding that is UNEXPECTED or signals a complication."}
};
