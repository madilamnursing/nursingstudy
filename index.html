/* ===== QUESTION BANK: Unit 1 Prioritization, Rooms 101-103 =====
 Fields: id, r=room (1-6 or "B" boss), t=type, d=difficulty 1-4, tag, obj=what HESI is testing,
 s=stem, o=options, a=answer, x=per-option explanation, c=key clue, p=principle, st=strategy,
 pl=pearl, tr=[trapCode, specific trap note]  */
const QB = [];
const q = o => QB.push(o);

/* ---------- ROOM 101: ABCs & MASLOW ---------- */
q({id:"PRI-101-01",r:1,t:"mc",d:1,tag:"ABCs",obj:"Recognize an airway emergency after neck surgery",
s:"A client is 4 hours post-thyroidectomy. Which finding requires the nurse's immediate intervention?",
o:["Incisional pain rated 6/10","High-pitched sound on inspiration","Temperature 37.9°C (100.2°F)","Has not voided since surgery"],a:1,
x:["Pain is expected after surgery. Treat it, but it is not life-threatening.","Correct. Inspiratory stridor signals upper-airway narrowing (laryngeal edema, hematoma, or laryngospasm from hypocalcemia). Airway comes first.","A low-grade temperature in the first 24 h is common and is not an airway threat.","Voiding within 6–8 h is the goal. This needs monitoring, not emergency action."],
c:"'High-pitched sound on inspiration' = stridor = airway.",p:"ABCs: Airway beats breathing, circulation, pain, and elimination.",
st:"When one option describes a sound or symptom of the airway, check it first against the rest.",pl:"Post-thyroidectomy keep at bedside: suction, oxygen, trach tray, and IV calcium gluconate.",
tr:["COMFORT","Pain feels urgent because the client is suffering, but pain does not kill as quickly as a narrowing airway."]});

q({id:"PRI-101-02",r:1,t:"mc",d:2,tag:"ABCs",obj:"Assess before moving a client after a fall",
s:"The nurse finds a 79-year-old client on the floor beside the bed. The client is awake, has a small bleeding scalp laceration, and reports right hip pain. What should the nurse do first?",
o:["Lift the client back into bed with help from another staff member","Apply direct pressure to the scalp laceration","Assess airway, breathing, level of consciousness, and for injuries before moving the client","Notify the health care provider of the fall"],a:2,
x:["Moving a client with possible hip fracture or head or spine injury before assessing can worsen the injury.","The scalp wound is minor and oozing. Address it right after the quick primary assessment.","Correct. A rapid ABC/LOC check and injury survey comes before moving. Hip pain after a fall suggests fracture.","The provider will be notified, but the nurse must assess the client first to report useful data."],
c:"Awake + hip pain + head wound = possible fracture and head injury. Do not move yet.",p:"Assess before you intervene when the client is not in immediate distress.",
st:"'Assess' is correct when you do not yet know the extent of the problem. Here you have not examined the client.",pl:"After any fall: ABCs, LOC, injury check, then move safely. Monitor neuro status, especially on anticoagulants.",
tr:["TRUEBUT","Controlling bleeding is a real action, but this scalp ooze is not life-threatening. The full assessment protects against worse hidden injuries."]});

q({id:"PRI-101-03",r:1,t:"mc",d:3,tag:"ABCs",obj:"First action for anaphylaxis during an IV medication",
s:"Ten minutes into an IV cefazolin infusion, the client develops hives, wheezing, and a BP of 88/50 mm Hg. What is the nurse's first action?",
o:["Administer epinephrine IM as prescribed","Stop the cefazolin infusion","Administer diphenhydramine IV","Raise the head of the bed to high Fowler's"],a:1,
x:["Epinephrine is the drug of choice and comes immediately next, but the allergen keeps flowing while you prepare it.","Correct. Stop the source of the allergen first. It takes one second and keeps more antigen from entering. Then give epinephrine, maintain the airway, and call for help.","Antihistamines are adjunct therapy. They do not reverse airway swelling or shock.","With hypotension, high Fowler's can worsen perfusion. Position for breathing and BP, but this is not the first step."],
c:"Reaction began DURING the infusion. The cause is still running.",p:"Remove the cause first: stop the infusion, then treat.",
st:"For any infusion reaction (allergy, transfusion, infiltration), 'stop the infusion' is almost always first.",pl:"Anaphylaxis: epinephrine IM 0.3–0.5 mg (1 mg/mL) in the mid-anterolateral thigh. Keep the IV line open with saline.",
tr:["TRUEBUT","Epinephrine is the most important DRUG, which makes it tempting. But stopping the cefazolin is instant and should happen first."]});

q({id:"PRI-101-04",r:1,t:"sata",d:2,tag:"ABCs",obj:"Identify early signs of hypoxia",
s:"The nurse is monitoring a client with pneumonia. Which findings are EARLY signs of hypoxia? Select all that apply.",
o:["Restlessness","Tachycardia","Tachypnea","Central cyanosis","Bradycardia"],a:[0,1,2],
x:["Correct. The brain is sensitive to low O2. Restlessness and anxiety are early cues.","Correct. The heart speeds up to increase oxygen delivery.","Correct. Breathing faster is an early compensation.","Cyanosis is a LATE sign. Waiting for blue skin means waiting too long.","Bradycardia is a LATE sign of severe hypoxia and pending arrest."],
c:"Early = compensation (fast, restless). Late = failure (slow, blue, confused).",p:"Catch hypoxia while the body is still compensating.",
st:"In SATA, judge each option as true or false on its own. Do not look for a 'pattern' in how many to pick.",pl:"Early hypoxia: RAT = Restlessness, Anxiety, Tachycardia/Tachypnea. Late hypoxia: BBC = Bradycardia, Bradypnea, Cyanosis.",
tr:["EXPECT","Cyanosis and bradycardia ARE signs of hypoxia, but late ones. The question asked for EARLY signs."]});

q({id:"PRI-101-05",r:1,t:"rank",d:3,tag:"ABCs",obj:"Rank clients using ABCs",
s:"Rank these clients in the order the nurse should see them (first to last).",
o:["Post-op client on morphine with RR 8/min and difficult to arouse","Client with chest pain 7/10, diaphoretic","Alert client with blood glucose 62 mg/dL asking for juice","Client requesting discharge teaching"],a:[0,1,2,3],
x:["1st – Breathing. Opioid-induced respiratory depression can cause arrest within minutes.","2nd – Circulation. Possible ACS: needs ECG and assessment right away.","3rd – Hypoglycemia, but alert and able to swallow. Can be treated quickly with 15 g of carbohydrate (or delegated).","4th – Stable teaching need. This client can wait."],
c:"RR 8 + hard to arouse = breathing failure.",p:"Airway → Breathing → Circulation → other physiologic needs → teaching.",
st:"Find the client who will die first without you, then the next.",pl:"POSS sedation scale 3 to 4 (frequently drowsy, or minimal response) = stop the opioid and notify. Naloxone at the bedside.",
tr:["NUMBER","Chest pain feels most dramatic, but slowed breathing with sedation is the faster killer."]});

q({id:"PRI-101-06",r:1,t:"mc",d:2,tag:"Maslow",obj:"Apply Maslow: physiologic before psychosocial",
s:"A client newly diagnosed with colon cancer is crying about the diagnosis. The client had surgery 8 hours ago, has not voided, and has a firm, distended lower abdomen. What should the nurse do first?",
o:["Sit with the client and encourage expression of fears","Perform a bladder scan and assess for urinary retention","Request a chaplain visit","Provide written information about the cancer diagnosis"],a:1,
x:["Therapeutic presence matters and should follow soon, but a physiologic problem is present.","Correct. No void in 8 h + distended bladder = probable urinary retention, a physiologic need (Maslow level 1).","Spiritual support is a psychosocial need. Valuable, but not first.","Teaching is not appropriate while the client is distressed and physically uncomfortable."],
c:"No void 8 h + firm, distended abdomen.",p:"Maslow: physiologic needs before love/belonging.",
st:"When one option is physical and the others are emotional, the physical one usually wins, unless the emotion is a safety risk.",pl:"Post-op: void within 6–8 h. Bladder scan >400–500 mL usually means retention; catheterize per protocol.",
tr:["COMFORT","Emotional support is kind and important, but the distended bladder is a physiologic problem that comes first."]});

q({id:"PRI-101-07",r:1,t:"mc",d:3,tag:"ABCs",obj:"Clear an obstructed artificial airway",
s:"A client with a tracheostomy is coughing ineffectively. The SpO2 has dropped from 95% to 89%, and coarse rhonchi are heard over the trachea. What is the nurse's first action?",
o:["Increase the oxygen flow rate","Suction the tracheostomy","Notify respiratory therapy","Obtain an arterial blood gas"],a:1,
x:["More oxygen will not get past a secretion plug. Fix the obstruction.","Correct. Coarse rhonchi over the trachea plus falling SpO2 = secretions blocking the airway. Suctioning clears the airway.","The nurse can and should suction independently. Calling delays care.","An ABG gives data but delays treatment of an obvious, fixable cause."],
c:"Coarse rhonchi over the trachea = secretions in the large airway.",p:"Treat the cause of hypoxia (obstruction) instead of masking it.",
st:"Ask 'Why is the SpO2 low?' and choose the option that fixes that reason.",pl:"Trach suction: hyperoxygenate, sterile technique, suction no more than 10–15 seconds, apply suction only on withdrawal.",
tr:["TRUEBUT","More oxygen seems logical for low SpO2, but it cannot pass a mucus plug. Suction first."]});

q({id:"PRI-101-08",r:1,t:"mc",d:4,tag:"ABCs",obj:"Protect the airway in active GI hemorrhage",
s:"A 62-year-old client with an upper GI bleed is vomiting bright red blood. BP 92/58 mm Hg, HR 118/min. The client is alert and has one 22-gauge peripheral IV. Which action is the nurse's highest priority?",
o:["Insert a second large-bore (18-gauge) IV catheter","Position the client on the side with the head of the bed elevated","Prepare to administer packed red blood cells","Insert a nasogastric tube to lavage"],a:1,
x:["Large-bore access is essential and comes very quickly, but it addresses circulation, not airway.","Correct. Active hematemesis is an aspiration risk. Positioning protects the airway and takes seconds. Then large-bore IVs, fluids, and blood.","Blood will likely be needed, but it requires type and crossmatch and large-bore access first.","NG placement is not first-line in all GI bleeds and does not protect the airway."],
c:"Actively vomiting blood = airway at risk, even though the vitals point to circulation.",p:"Airway before circulation, even in a bleeding client.",
st:"When the vital signs scream 'circulation', still scan for an airway threat in the stem.",pl:"GI bleed: protect the airway, 2 large-bore IVs, type and cross, monitor Hgb, BUN rises with upper GI bleeding.",
tr:["NUMBER","The low BP and high HR pull you toward IV access, but aspiration of blood can kill faster."]});

q({id:"PRI-101-09",r:1,t:"sata",d:3,tag:"ABCs",obj:"Recognize airway threats across clients",
s:"Which clients have findings indicating an AIRWAY threat requiring immediate action? Select all that apply.",
o:["Client rescued from a house fire with singed nasal hair and a hoarse voice","Client post-thyroidectomy with increasing neck swelling and new hoarseness","Client with long-standing COPD and a barrel chest","Client with snoring respirations after procedural sedation and SpO2 falling to 88%","Client with a productive cough of white sputum, SpO2 95%"],a:[0,1,3],
x:["Correct. Inhalation injury: airway edema can close the airway within hours. Anticipate early intubation.","Correct. A hematoma or edema is compressing the airway. Increasing swelling plus hoarseness is an emergency.","A barrel chest is a chronic, expected COPD finding, not an acute airway threat.","Correct. Snoring = partial obstruction from the tongue. Use a head-tilt/jaw-thrust, stimulate, and support ventilation.","A productive cough with normal SpO2 means the airway is being cleared effectively."],
c:"Hoarseness, swelling, singed hair, snoring = upper-airway compromise.",p:"Airway threats are often subtle sounds or voice changes, not low numbers.",
st:"Listen for words like hoarse, stridor, snoring, drooling, swelling.",pl:"Burn clue: singed nasal hair, soot in sputum, hoarseness = suspect inhalation injury and prepare for intubation.",
tr:["CHRONIC","A barrel chest looks abnormal, but it is a stable chronic COPD finding."]});

q({id:"PRI-101-10",r:1,t:"cloze",d:2,tag:"ABCs",obj:"Classify and prioritize using ABCs",
s:"A client develops angioedema of the lips and tongue. The nurse identifies this as a(n) {0} problem and prioritizes this client {1} a client with a BP of 86/50 mm Hg. The nurse's first action is to {2}.",
o:[["airway","breathing","circulation"],["before","after"],["stay with the client and call the rapid response team","give an oral antihistamine","obtain a complete allergy history"]],a:[0,0,0],
x:["Angioedema of the tongue threatens the AIRWAY.","Airway comes before circulation.","Correct. Stay, call for help, and prepare for epinephrine and airway support. Oral meds are unsafe with tongue swelling, and a history delays care."],
c:"Swollen tongue = airway.",p:"A before B before C.",
st:"In cloze items, fill each blank and then reread the whole sentence. It should make clinical sense.",pl:"ACE inhibitor angioedema can occur even years into therapy. Stop the ACE inhibitor permanently.",
tr:["NUMBER","A BP of 86/50 looks alarming, but an obstructed airway causes death sooner."]});

/* ---------- ROOM 102: WHO DO I SEE FIRST ---------- */
q({id:"PRI-102-01",r:2,t:"mc",d:2,tag:"Stable vs Unstable",obj:"Identify the unstable client after report",
s:"After hand-off report, which client should the nurse assess first?",
o:["Client with COPD, SpO2 90% on 2 L/min nasal cannula (baseline 89–92%)","Client with heart failure, 1+ ankle edema, weight up 0.2 kg","Post-op client, BP 88/50 mm Hg and HR 124/min (BP 128/76 four hours ago)","Client with diabetes, pre-lunch glucose 210 mg/dL"],a:2,
x:["At baseline for COPD. Stable and chronic.","Minimal edema and weight change. Stable.","Correct. An acute drop in BP with rising HR after surgery = possible hemorrhage or hypovolemic shock.","High, but not an emergency. Treat per sliding scale."],
c:"BP fell 40 points and HR is rising = acute change.",p:"Unstable and acute beat stable and chronic.",
st:"Look for TREND words: 'was', 'now', 'four hours ago'. A change from baseline is the cue.",pl:"Shock in progress: HR rises BEFORE BP falls. Falling BP is a late, decompensated sign.",
tr:["CHRONIC","SpO2 90% looks low, but it is this COPD client's baseline."]});

q({id:"PRI-102-02",r:2,t:"mc",d:2,tag:"Acute vs Chronic",obj:"Prioritize a new dysrhythmia",
s:"Which client should the nurse see first?",
o:["Client with CKD, potassium 5.3 mEq/L","Client with new-onset atrial fibrillation, HR 142/min, BP 100/60 mm Hg, asking for water","Client with a chronic venous ulcer due for a dressing change","Client with cirrhosis, stable ascites, abdominal girth unchanged"],a:1,
x:["Mildly elevated and common in CKD. Monitor.","Correct. New rapid atrial fibrillation with soft BP can decompensate (low cardiac output, clot risk). Acute and unstable.","Chronic and routine. Can wait.","Stable chronic finding."],
c:"'New-onset' + HR 142 + soft BP.",p:"New and unstable beats chronic and stable.",
st:"The word 'new' in a stem is a flag. 'Stable' and 'unchanged' are permission to wait.",pl:"AFib with rapid ventricular response: rate control (diltiazem or a beta blocker). If unstable, synchronized cardioversion. Assess stroke risk for anticoagulation.",
tr:["NUMBER","A potassium of 5.3 sounds scary, but in CKD it is mild and expected."]});

q({id:"PRI-102-03",r:2,t:"mc",d:3,tag:"Who Can Wait",obj:"Identify the client who can safely wait",
s:"The nurse has four clients. Which client can the nurse safely see LAST?",
o:["Client 2 days post-MI asking when sexual activity can resume","Client in sickle cell crisis reporting pain 9/10","Client on a heparin infusion with an aPTT of 110 seconds","Client with pneumonia, temperature 38.9°C (102°F), and new confusion"],a:0,
x:["Correct. An important teaching need, but stable and not time-sensitive.","Sickle cell crisis needs prompt analgesia, hydration, and oxygen. Pain causes more sickling.","An aPTT this far above the therapeutic range means bleeding risk. The infusion likely needs to be held per protocol.","New confusion plus fever may be sepsis or hypoxia. Acute change."],
c:"Stable teaching question vs three physiologic problems.",p:"Teaching and psychosocial needs wait for physiologic instability.",
st:"For 'see last' questions, find the most stable, non-urgent client. Flip your thinking.",pl:"Post-MI: sexual activity is usually OK when the client can climb 2 flights of stairs without symptoms.",
tr:["NUMBER","The aPTT and fever look like 'just numbers', but both signal risk. The teaching question is the true 'can wait'."]});

q({id:"PRI-102-04",r:2,t:"mc",d:4,tag:"Stable vs Unstable",obj:"Recognize early sepsis in an older adult",
s:"Which client requires the nurse's attention first?",
o:["78-year-old with a UTI, newly confused, HR 112/min, RR 24/min, BP 98/60 mm Hg","45-year-old with appendicitis awaiting surgery, pain 8/10, vitals within normal limits","60-year-old 3 days post-stroke with dysphagia, lunch tray just delivered","30-year-old with asthma, peak flow 85% of personal best"],a:0,
x:["Correct. Infection + altered mentation + RR ≥22 + SBP ≤100 = positive qSOFA. Likely sepsis, which is time-critical.","Needs pain management and monitoring, but vitals are stable.","Aspiration precautions matter; the meal can wait a few minutes.","85% of personal best = green zone. Well controlled."],
c:"Older adult + infection + NEW confusion + abnormal vitals.",p:"Sepsis is a time-sensitive emergency. Every hour of delay increases mortality.",
st:"In older adults, new confusion is often the FIRST sign of infection, hypoxia, or sepsis.",pl:"qSOFA: RR ≥22, altered mentation, SBP ≤100. Two or more = high risk.",
tr:["COMFORT","Pain 8/10 is a strong pull, but sepsis is the hidden killer here."]});

q({id:"PRI-102-05",r:2,t:"sata",d:2,tag:"Stable vs Unstable",obj:"Recognize instability cues",
s:"Which findings indicate a client is UNSTABLE and needs to be assessed immediately? Select all that apply.",
o:["Sudden change in level of consciousness","New-onset chest pain","Urine output of 20 mL/hr for the past 2 hours","Stage 2 pressure injury present on admission","Temperature 37.4°C (99.3°F)","SpO2 94% on room air"],a:[0,1,2],
x:["Correct. A sudden LOC change can mean hypoxia, stroke, hypoglycemia, or sepsis.","Correct. New chest pain could be ACS or PE.","Correct. Output below 30 mL/hr (about 0.5 mL/kg/hr) suggests hypoperfusion or AKI.","Present on admission and chronic. Needs care, not emergency attention.","Within the normal range.","Acceptable for most clients."],
c:"Sudden, new, decreasing.",p:"Acute changes in LOC, perfusion, or cardiopulmonary status = unstable.",
st:"Words like 'sudden', 'new', and 'for the past 2 hours' signal acute change.",pl:"Minimum urine output: 30 mL/hr or 0.5 mL/kg/hr.",
tr:["CHRONIC","A pressure injury is a real problem, but chronic and present on admission."]});

q({id:"PRI-102-06",r:2,t:"mc",d:4,tag:"Acute vs Chronic",obj:"Spot an acute complication among chronic conditions",
s:"Which client finding requires immediate follow-up?",
o:["Client with Parkinson's disease who has a resting tremor","Client with multiple sclerosis who reports fatigue in the afternoon","Client with type 2 diabetes who has had tingling in both feet for years","Client 2 days after hip fracture repair with sudden dyspnea and anxiety"],a:3,
x:["An expected, chronic Parkinson's finding.","Fatigue is the most common MS symptom and is expected.","Long-standing peripheral neuropathy. Chronic.","Correct. After orthopedic surgery, sudden dyspnea plus anxiety = possible PE or fat embolism. Emergency."],
c:"'Sudden' after orthopedic surgery and immobility.",p:"Acute beats chronic.",
st:"Three options describe a disease doing what it usually does. Pick the one that is a new complication.",pl:"Post-op hip: watch for DVT/PE (anticoagulation, early ambulation), fat embolism (24–72 h; petechiae, confusion, hypoxia), and dislocation.",
tr:["CHRONIC","Tremor, fatigue, and neuropathy are all real symptoms, but expected and long-standing."]});

q({id:"PRI-102-07",r:2,t:"mc",d:2,tag:"Stable vs Unstable",obj:"Recognize an acute hemolytic transfusion reaction",
s:"After report, which client should the nurse see first?",
o:["Client who finished bowel prep and is waiting for a colonoscopy","Client 10 minutes into a blood transfusion who reports chills and low back pain","Client with chronic pain whose scheduled medication is due in 30 minutes","Client with pneumonia who needs a sputum specimen collected"],a:1,
x:["Routine pre-procedure client.","Correct. Chills + low back pain early in a transfusion = possible acute hemolytic reaction. Stop the transfusion now.","The medication is not yet due. Can wait.","Routine. Could be delegated."],
c:"Early in transfusion + back pain + chills.",p:"Most severe transfusion reactions happen in the first 15 minutes.",
st:"Any client receiving blood who reports a new symptom goes to the top of the list.",pl:"Stay with the client for the first 15 minutes of a transfusion. Reaction = stop, keep the line open with NS via new tubing, notify, return the bag.",
tr:["COMFORT","Scheduled pain medication feels important, but it is not due and the client is stable."]});

q({id:"PRI-102-08",r:2,t:"rank",d:3,tag:"Stable vs Unstable",obj:"Rank a mixed assignment",
s:"Rank these clients in the order the nurse should assess them (first to last).",
o:["Client extubated 1 hour ago with new inspiratory stridor","Client with right-sided facial droop and slurred speech that began 30 minutes ago","Client 3 hours post-appendectomy reporting pain 7/10","Client with stable angina who wants to walk in the hall"],a:[0,1,2,3],
x:["1st – Airway. Post-extubation laryngeal edema can obstruct completely.","2nd – Time-critical stroke. Activate the stroke team; the window for thrombolytics is closing.","3rd – Expected post-op pain needing treatment.","4th – Stable chronic condition."],
c:"Stridor = airway. Stroke = time is brain.",p:"Airway first, then time-critical circulation and neurologic events, then expected problems.",
st:"Rank in pairs: compare each client to the next and ask who would deteriorate faster.",pl:"Stroke: last known well time matters. Alteplase is usually given within 3–4.5 h of onset.",
tr:["TRUEBUT","The stroke is urgent and time-critical, but an obstructing airway kills in minutes."]});

q({id:"PRI-102-09",r:2,t:"mc",d:1,tag:"Acute vs Chronic",obj:"Acute over chronic",
s:"Which client problem should the nurse address first?",
o:["Chronic lymphedema of the left arm","Acute urinary retention with 900 mL on bladder scan","Chronic constipation","Chronic insomnia"],a:1,
x:["Chronic, long-standing.","Correct. Acute and causing harm. Bladder overdistention can damage the bladder and cause autonomic changes.","Chronic.","Chronic."],
c:"'Acute' vs 'chronic'.",p:"Acute problems usually take priority over chronic problems.",
st:"When three options share a word (chronic), the different one is often the answer.",pl:"A bladder holding more than 500 mL that the client can't empty generally needs catheterization per protocol.",
tr:["CHRONIC","The other problems are real but long-standing. 'Acute' is the clue."]});

q({id:"PRI-102-10",r:2,t:"mc",d:4,tag:"Lab Priority",obj:"Prioritize labs paired with symptoms",
s:"The nurse reviews morning labs. Which client requires action first?",
o:["Client taking digoxin: potassium 3.0 mEq/L, reports nausea and yellow-tinged vision","Client with CKD: hemoglobin 9.8 g/dL","Client with type 2 diabetes: HbA1c 8.2%","Client with acute pancreatitis: serum amylase elevated"],a:0,
x:["Correct. Hypokalemia increases the risk of digoxin toxicity, and nausea plus visual changes are toxicity signs. Risk of fatal dysrhythmias.","Anemia is expected in CKD (low erythropoietin).","Shows poor long-term control. Needs a plan, not emergency action.","Expected for pancreatitis. It confirms the diagnosis."],
c:"Low K + digoxin + symptoms = toxicity.",p:"A lab value WITH symptoms and a dangerous medication outranks an isolated expected lab.",
st:"Pair the lab with the diagnosis or medication. Expected abnormal labs are distractors.",pl:"Digoxin toxicity: GI upset, visual halos (yellow-green), bradycardia, dysrhythmias. Level >2 ng/mL. Hypokalemia potentiates toxicity. Antidote: digoxin immune fab.",
tr:["EXPECT","Elevated amylase looks abnormal, but it is exactly what pancreatitis does."]});

/* ---------- ROOM 103: EXPECTED VS UNEXPECTED ---------- */
q({id:"PRI-103-01",r:3,t:"mc",d:2,tag:"Expected vs Unexpected",obj:"Identify a post-op complication",
s:"A client is 1 day post-op after abdominal surgery. Which finding requires follow-up?",
o:["Hypoactive bowel sounds","Incisional pain 5/10 with movement","Temperature 37.6°C (99.7°F)","Unilateral calf swelling and tenderness"],a:3,
x:["Expected after abdominal surgery and anesthesia.","Expected post-op pain.","A low-grade temperature in the first 24 h is common (inflammatory response).","Correct. Possible DVT. Unilateral swelling and pain need prompt reporting."],
c:"'Unilateral' leg swelling.",p:"Find the complication, not the expected recovery finding.",
st:"Ask of each option: 'Is this the surgery or a complication?'",pl:"DVT: unilateral swelling, warmth, pain. Do not massage the leg. Report, and anticipate a duplex ultrasound.",
tr:["EXPECT","Hypoactive bowel sounds sound abnormal, but they are expected on post-op day 1."]});

q({id:"PRI-103-02",r:3,t:"mc",d:2,tag:"Expected vs Unexpected",obj:"Chest tube troubleshooting",
s:"A client has a chest tube to wet suction for a pneumothorax. Which finding requires intervention?",
o:["Fluctuation (tidaling) in the water-seal chamber with breathing","Intermittent bubbling in the water-seal chamber when the client coughs","Continuous bubbling in the water-seal chamber","Gentle continuous bubbling in the suction-control chamber"],a:2,
x:["Expected. Tidaling shows the tube is patent and pressures are changing with breathing.","Can be expected with a pneumothorax as air leaves the pleural space.","Correct. Continuous water-seal bubbling = an air leak in the system or the client. Check the connections from the client downward.","Expected with wet suction. It means suction is working."],
c:"'Continuous' + 'water-seal'.",p:"Know the normal behavior of each chamber.",
st:"Memorize: water seal = intermittent bubbling OK; continuous = leak. Suction control (wet) = continuous gentle bubbling OK.",pl:"Air leak: check the system starting at the client's chest. Briefly clamping close to the chest (only if prescribed) tells you whether the leak is in the client or the system.",
tr:["EXPECT","Bubbling in the suction-control chamber is normal. The location of the bubbling is the key."]});

q({id:"PRI-103-03",r:3,t:"sata",d:3,tag:"Expected vs Unexpected",obj:"Interpret findings in heart failure on a diuretic",
s:"A client with heart failure is receiving furosemide. Which findings require follow-up? Select all that apply.",
o:["Potassium 3.1 mEq/L","Weight gain of 1.5 kg (3.3 lb) in 2 days","New bilateral crackles at the lung bases","Increased urine output after the dose","BP 118/72 mm Hg"],a:[0,1,2],
x:["Correct. Hypokalemia from a loop diuretic raises dysrhythmia risk (and digoxin toxicity risk).","Correct. Rapid weight gain = fluid retention. Report >1 kg (2–3 lb) in a day or 2 kg (5 lb) in a week.","Correct. New crackles = worsening pulmonary congestion.","Expected. The drug is working.","Acceptable BP."],
c:"Low K, fast weight gain, new crackles.",p:"Separate the expected drug effect from adverse effects and worsening disease.",
st:"For drug questions, sort each option into: therapeutic effect, adverse effect, or disease worsening.",pl:"Daily weight: same time, same scale, same clothing. It is the best indicator of fluid status.",
tr:["EXPECT","Increased urine output may look like a 'change', but it is the therapeutic effect of furosemide."]});

q({id:"PRI-103-04",r:3,t:"mc",d:2,tag:"Expected vs Unexpected",obj:"Recognize hypocalcemia after thyroidectomy",
s:"Twelve hours after a total thyroidectomy, which client finding requires immediate follow-up?",
o:["Mild hoarseness","Sore throat when swallowing","Tingling around the mouth and in the fingertips","Incisional pain rated 4/10"],a:2,
x:["Mild hoarseness is common from intubation and edema. Monitor for worsening.","Expected after intubation and neck surgery.","Correct. Circumoral and fingertip paresthesia = hypocalcemia from parathyroid injury or removal. It can progress to tetany and laryngospasm.","Expected and moderate."],
c:"Tingling = low calcium.",p:"Know the complication of each surgery: thyroidectomy → hypocalcemia, bleeding, airway compromise.",
st:"When an option describes a sensation that fits a known complication of the procedure, it is usually the answer.",pl:"Hypocalcemia signs: Chvostek (facial twitch), Trousseau (carpal spasm with BP cuff). Treat with IV calcium gluconate.",
tr:["EXPECT","Hoarseness alarms many students, but mild hoarseness is expected. Worsening hoarseness or stridor is not."]});

q({id:"PRI-103-05",r:3,t:"mc",d:2,tag:"Expected vs Unexpected",obj:"Recognize hepatic encephalopathy",
s:"Which finding in a client with cirrhosis should the nurse report immediately?",
o:["Ascites","Spider angiomas on the chest","Palmar erythema","New flapping tremor of the hands and confusion"],a:3,
x:["An expected, chronic finding in cirrhosis.","Expected (from estrogen excess).","Expected.","Correct. Asterixis + confusion = hepatic encephalopathy from rising ammonia. Anticipate lactulose or rifaximin."],
c:"'New' + neurological change.",p:"In chronic disease, neurological change signals a dangerous complication.",
st:"Three options describe chronic skin or abdominal changes; one describes the brain. The brain wins.",pl:"Lactulose goal: 2–3 soft stools per day. It traps ammonia in the gut for excretion.",
tr:["CHRONIC","Ascites looks dramatic, but it is a known chronic finding. The new neuro change is the emergency."]});

q({id:"PRI-103-06",r:3,t:"mc",d:1,tag:"Expected vs Unexpected",obj:"Left vs right heart failure",
s:"Which finding is expected in a client with LEFT-sided heart failure?",
o:["Crackles in the lungs","Jugular venous distention","Hepatomegaly","Dependent peripheral edema"],a:0,
x:["Correct. Left side fails → blood backs up into the Lungs → crackles, dyspnea, orthopnea.","JVD is a right-sided (systemic) finding.","Right-sided, from venous congestion of the liver.","Mostly right-sided (systemic congestion)."],
c:"LEFT = Lungs.",p:"Left HF → pulmonary congestion. Right HF → systemic congestion.",
st:"Use 'Left = Lungs, Right = Rest of the body'.",pl:"Pink frothy sputum + severe dyspnea = acute pulmonary edema. High Fowler's, O2, IV diuretic.",
tr:["EXPECT","JVD is a heart failure finding, but for the right side. Read 'LEFT' carefully."]});

q({id:"PRI-103-07",r:3,t:"mc",d:3,tag:"Expected vs Unexpected",obj:"Recognize retroperitoneal bleeding after a femoral procedure",
s:"Two hours after a cardiac catheterization through the right femoral artery, which finding requires immediate action?",
o:["Pedal pulses 2+ bilaterally","A 2-cm bruise at the insertion site","New back and flank pain with HR increasing from 78 to 104/min","Client asking to sit up"],a:2,
x:["Normal. Distal circulation is intact.","A small, stable bruise is common. Mark it and monitor.","Correct. Back or flank pain + tachycardia after femoral access = possible retroperitoneal bleed. The bleeding is hidden, not at the site.","Common request. Keep the head of bed per protocol (often ≤30°) and the leg straight."],
c:"Flank pain + rising HR = hidden bleeding.",p:"Bleeding can be internal. Vital sign trends reveal what you can't see.",
st:"When the dressing looks fine but the vitals are changing, think internal bleeding.",pl:"Post-femoral cath: check the site, distal pulses, color, warmth, and sensation often. Keep the leg straight for the prescribed time.",
tr:["ASSESS","A bruise is visible and tempting, but small and expected. The hidden bleed is the danger."]});

q({id:"PRI-103-08",r:3,t:"matrix",d:4,tag:"Expected vs Unexpected",obj:"Classify COPD findings (NGN matrix)",
s:"A 70-year-old client with COPD is admitted with an exacerbation. For each finding, indicate whether it is EXPECTED for this client or REQUIRES FOLLOW-UP.",
cols:["Expected","Requires follow-up"],
o:["Barrel chest","SpO2 89% on 2 L/min (home baseline 88–92%)","New drowsiness and confusion","Pursed-lip breathing","RR 32/min with increasing accessory muscle use"],a:[0,0,1,0,1],
x:["Expected. Chronic hyperinflation.","Expected. At the target range for COPD.","Requires follow-up. Suggests CO2 retention (hypercapnic respiratory failure). Get an ABG and notify.","Expected. A helpful technique that keeps airways open.","Requires follow-up. Increasing work of breathing means impending respiratory failure."],
c:"Change in mental status and work of breathing.",p:"In COPD, the trend and mental status matter more than a single SpO2.",
st:"Matrix items: evaluate each row on its own. Don't assume a balance between columns.",pl:"COPD target SpO2 88–92%. Drowsiness in a COPD client = check for rising CO2.",
tr:["CHRONIC","An SpO2 of 89% is tempting to flag, but it is this client's target."]});

q({id:"PRI-103-09",r:3,t:"mc",d:2,tag:"Expected vs Unexpected",obj:"Vancomycin infusion reaction",
s:"During a vancomycin infusion, the client develops flushing and itching of the face, neck, and upper chest. BP 124/78 mm Hg, no wheezing. What is the nurse's best action?",
o:["Continue the infusion; this is an expected effect","Stop the infusion and notify the provider; anticipate a slower infusion rate","Administer epinephrine IM","Apply ice to the flushed areas"],a:1,
x:["Not acceptable to ignore. This is an infusion-rate reaction that needs intervention.","Correct. Vancomycin infusion reaction (formerly 'red man syndrome') is related to infusion rate. Stop, notify, and expect a slower rate (over at least 60 min) and possibly an antihistamine.","No signs of anaphylaxis (stable BP, no airway involvement).","Does not address the cause."],
c:"Flushing of the upper body, stable BP, no airway signs.",p:"Distinguish an infusion-rate reaction from anaphylaxis.",
st:"Check for airway and BP involvement to tell an allergic emergency apart from a rate reaction.",pl:"Vancomycin: infuse over at least 60 min. Monitor troughs or AUC, renal function, and hearing (ototoxicity).",
tr:["ASSESS","Epinephrine is tempting when you see skin changes, but there is no airway or BP compromise."]});

q({id:"PRI-103-10",r:3,t:"mc",d:3,tag:"Expected vs Unexpected",obj:"Recognize obstruction in continuous bladder irrigation",
s:"A client is 6 hours post-TURP with continuous bladder irrigation. Which finding requires immediate intervention?",
o:["Light pink urine","Bladder spasms","Bright red urine with clots and decreased catheter outflow","Feeling the urge to void"],a:2,
x:["Expected. The irrigation goal is light pink.","Common after TURP. Treat with antispasmodics.","Correct. Bright red with clots = arterial bleeding. Decreased outflow = clot obstruction, risking bladder distention. Increase irrigation per protocol, assess, and notify.","Common because of the catheter balloon."],
c:"Bright red + clots + decreased output.",p:"Bleeding plus obstruction = a complication.",
st:"Output that is less than the irrigation going in means obstruction until proven otherwise.",pl:"True urine output = total drainage minus irrigant volume.",
tr:["EXPECT","Bladder spasms are uncomfortable and dramatic, but expected after TURP."]});

/* ---------- ROOM 104: DELEGATION & SCOPE ---------- */
q({id:"PRI-104-01",r:4,t:"mc",d:1,tag:"Delegation",obj:"UAP scope",
s:"Which task can the RN delegate to unlicensed assistive personnel (UAP)?",
o:["Obtaining vital signs on a stable post-op client","Assessing a newly admitted client","Teaching a client to self-administer insulin","Evaluating a client's response to pain medication"],a:0,
x:["Correct. Routine data collection on a STABLE client is within UAP scope.","Assessment is an RN responsibility.","Teaching is an RN responsibility.","Evaluation is an RN responsibility."],
c:"'Stable' + 'routine'.",p:"Don't delegate what you EAT: Evaluate, Assess, Teach.",
st:"Eliminate any option containing assess, teach, evaluate, or plan.",pl:"UAP may collect data (vitals, I&O, weights); the RN interprets it.",
tr:["DELEGATE","Evaluating pain relief sounds like a simple check, but evaluation is an RN function."]});

q({id:"PRI-104-02",r:4,t:"mc",d:2,tag:"Delegation",obj:"LPN/LVN scope",
s:"Which task is most appropriate to assign to the LPN/LVN?",
o:["Completing the admission assessment of a client with chest pain","Administering scheduled oral medications to a stable client","Providing initial teaching for a new colostomy","Developing the plan of care for a client with a new stroke"],a:1,
x:["The initial assessment of an unstable or new client is RN scope.","Correct. Medication administration to a stable client with predictable outcomes is within LPN scope.","Initial teaching is RN. The LPN can REINFORCE teaching.","Care planning is RN scope."],
c:"'Stable' + 'scheduled oral'.",p:"LPNs care for stable, predictable clients.",
st:"'Initial' = RN. 'Reinforce' = LPN.",pl:"LPN scope varies by state. On HESI, default to stable clients, oral/IM/subQ meds, dressings, tube feedings, and reinforcing teaching.",
tr:["DELEGATE","Teaching a colostomy looks hands-on, but INITIAL teaching belongs to the RN."]});

q({id:"PRI-104-03",r:4,t:"mc",d:3,tag:"Delegation",obj:"Keep the unstable client with the RN",
s:"An RN, LPN, and UAP are caring for four clients. Which client should the RN care for?",
o:["Client with stable type 2 diabetes needing fingerstick glucose checks","Client 1 day post-op hip arthroplasty, vitals stable","Newly admitted client with diabetic ketoacidosis on an IV insulin infusion","Client with chronic dementia who needs help with feeding"],a:2,
x:["Fingersticks on a stable client can be done by UAP.","A stable post-op client can go to the LPN.","Correct. New admission + unstable condition + high-alert IV infusion that needs titration = RN.","Feeding a client without swallowing problems can be done by UAP."],
c:"'Newly admitted' + 'DKA' + 'IV insulin'.",p:"Unstable, new, or complex clients and high-alert IV meds = RN.",
st:"Assign the RN the most unstable or complex client first, then distribute the rest.",pl:"Insulin drip: hourly glucose, monitor potassium (insulin drives K into cells).",
tr:["DELEGATE","The hip arthroplasty client sounds complex, but 'stable' makes this client safe for the LPN."]});

q({id:"PRI-104-04",r:4,t:"sata",d:3,tag:"Delegation",obj:"Appropriate UAP tasks",
s:"Which tasks can the RN appropriately delegate to the UAP? Select all that apply.",
o:["Ambulating a stable post-op client","Measuring and recording intake and output","Repositioning a client every 2 hours","Assessing a client's skin for breakdown","Feeding a client who had a stroke yesterday and has new dysphagia","Teaching a client how to use an incentive spirometer"],a:[0,1,2],
x:["Correct. Routine ambulation of a stable client.","Correct. Data collection. The RN interprets it.","Correct. Routine care.","Assessment is RN. UAP can REPORT redness they notice.","New dysphagia = aspiration risk that needs ongoing nursing assessment. Not appropriate for UAP.","Teaching = RN (an LPN can reinforce)."],
c:"Routine, stable, no judgment required.",p:"UAP: ADLs, mobility, measurements on stable clients.",
st:"For each option ask: 'Does this require nursing judgment?' If yes, don't delegate to UAP.",pl:"Stroke + new dysphagia: NPO until the swallow screen. Upright 90° for meals, chin tuck, thickened liquids as ordered.",
tr:["DELEGATE","Feeding is usually a UAP task, but NEW dysphagia makes it an assessment-heavy, high-risk task."]});

q({id:"PRI-104-05",r:4,t:"mc",d:2,tag:"Delegation",obj:"Responding to data reported by UAP",
s:"The UAP reports that a client's BP is 168/98 mm Hg. It was 132/80 mm Hg four hours ago. What is the nurse's best action?",
o:["Ask the UAP to recheck the BP in 1 hour","Go to assess the client","Document the finding in the chart","Administer the PRN antihypertensive immediately"],a:1,
x:["Delays action on an acute change and leaves the evaluation to the UAP.","Correct. The RN must personally assess the client (symptoms, accuracy, cause) before deciding on treatment.","Documentation alone does not address the change.","Treating without assessing could be inappropriate (pain, anxiety, or cuff error may be the cause)."],
c:"A significant change from baseline was reported by UAP.",p:"Data collected by UAP must be validated and interpreted by the RN.",
st:"When new data arrive through another person, 'assess the client' is often correct.",pl:"Before giving a PRN antihypertensive: confirm the reading, assess symptoms, and check parameters.",
tr:["TRUEBUT","The PRN may eventually be right, but giving it before assessing skips the nursing process."]});

q({id:"PRI-104-06",r:4,t:"mc",d:3,tag:"Assignment",obj:"Assign a float nurse",
s:"An RN floats from pediatrics to the adult medical-surgical unit. Which client assignment is most appropriate for this nurse?",
o:["Client with multiple traumas just transferred from the ICU","Client with stable pneumonia receiving IV antibiotics","Client with a new tracheostomy and frequent suctioning needs","Client with a complex wound vacuum requiring discharge teaching"],a:1,
x:["Complex and recently unstable. Needs an experienced med-surg nurse.","Correct. A stable client with standard nursing care uses skills that transfer across specialties.","A new trach is high risk and specialized.","Complex care and teaching specific to adult med-surg."],
c:"Float nurse = least complex, most stable, standard skills.",p:"Match the client to the nurse's competency.",
st:"Give float or agency nurses stable clients with predictable, common care.",pl:"Assignment rule: the most experienced nurse gets the most complex or unstable client.",
tr:["DELEGATE","Trach care is a skill pediatric nurses have, but a NEW trach in an adult is high-risk and specialized."]});

q({id:"PRI-104-07",r:4,t:"mc",d:2,tag:"Supervision",obj:"Intervene when a delegated task is unsafe",
s:"The nurse sees the UAP preparing to take a rectal temperature on a client with neutropenia (ANC 350/mm³). What should the nurse do?",
o:["Stop the UAP and explain that rectal temperatures are contraindicated in neutropenia","Let the UAP finish, then provide teaching","Report the UAP to the nurse manager","Take the rectal temperature personally"],a:0,
x:["Correct. Intervene immediately to prevent harm. Rectal procedures can damage the mucosa and introduce infection in neutropenic clients.","Allowing harm to occur is unsafe.","Not first. The immediate safety concern comes first.","The procedure itself is contraindicated no matter who does it."],
c:"Neutropenia + rectal = infection and injury risk.",p:"The RN supervises delegated tasks and intervenes immediately for safety.",
st:"When you see an unsafe action, stop it first. Teach and report later.",pl:"Neutropenic precautions: no rectal temps, suppositories, or enemas. Strict hand hygiene. Avoid fresh flowers and standing water.",
tr:["DELEGATE","Doing it yourself seems helpful, but the procedure is unsafe for this client no matter who does it."]});

q({id:"PRI-104-08",r:4,t:"mc",d:1,tag:"Five Rights",obj:"Right communication in delegation",
s:"Which instruction to the UAP best demonstrates the 'right direction/communication' of delegation?",
o:["'Please check vitals on the client in room 412.'","'Take vitals on 412 at 1000 and 1200. Tell me right away if SBP is below 100 or HR above 110.'","'Keep an eye on the client in 412.'","'Let me know if anything seems off with 412.'"],a:1,
x:["Lacks a time frame and reporting parameters.","Correct. It is specific: what, when, and exactly what to report and when.","Vague, and asks the UAP to use judgment.","Vague, and relies on UAP judgment."],
c:"Specific times + specific parameters.",p:"Clear, specific communication with reportable parameters.",
st:"The best delegation instruction is the most specific one.",pl:"5 Rights: task, circumstance, person, direction/communication, supervision/evaluation.",
tr:["DELEGATE","'Let me know if anything seems off' sounds collaborative, but it hands nursing judgment to the UAP."]});

q({id:"PRI-104-09",r:4,t:"mc",d:2,tag:"Assignment",obj:"Assign the stable chronic client to the LPN",
s:"Which client is most appropriate for the RN to assign to the LPN/LVN?",
o:["Client newly diagnosed with heart failure who needs discharge teaching","Client in the first 15 minutes of a blood transfusion","Client with stable chronic COPD awaiting long-term care placement","Client returning from a bronchoscopy 30 minutes ago"],a:2,
x:["Initial and discharge teaching for a new diagnosis = RN.","The first 15 minutes carry the highest reaction risk. RN monitoring needed.","Correct. Stable, chronic, predictable.","Immediately post-procedure: gag reflex, airway, and bleeding assessment = RN."],
c:"'Stable' + 'chronic' + 'awaiting placement'.",p:"LPN = stable and predictable.",
st:"Eliminate new, initial, first, and immediately post-procedure.",pl:"After bronchoscopy: NPO until the gag reflex returns. Watch for bleeding and pneumothorax.",
tr:["DELEGATE","The bronchoscopy client may look stable, but the immediate post-procedure period requires RN assessment."]});

q({id:"PRI-104-10",r:4,t:"sata",d:4,tag:"Delegation",obj:"LPN scope across tasks",
s:"Which tasks can the RN assign to an experienced LPN/LVN? Select all that apply.",
o:["Reinforcing teaching about a low-sodium diet","Administering an enteral feeding through an established gastrostomy tube","Performing a sterile dressing change on a stable surgical wound","Completing the initial assessment of a new admission","Developing the care plan for a client with a new amputation","Monitoring a stable client's fingerstick glucose and giving scheduled subQ insulin"],a:[0,1,2,5],
x:["Correct. LPNs reinforce teaching the RN initiated.","Correct. An established tube in a stable client.","Correct. Sterile technique on a stable wound is within LPN scope.","Initial assessment = RN.","Care planning = RN.","Correct. Scheduled subQ insulin for a stable client is typically within LPN scope (follow agency policy)."],
c:"Stable, established, reinforce, scheduled.",p:"LPN: implement established care; RN: assess, plan, evaluate, initiate teaching.",
st:"Find the action verb: reinforce, administer, perform = OK; assess, develop, plan = RN.",pl:"Always follow your state's nurse practice act and agency policy. HESI uses general standards.",
tr:["DELEGATE","A care plan seems like paperwork, but planning is an RN-only function."]});

/* ---------- ROOM 105: RAPID RESPONSE & DETERIORATION ---------- */
q({id:"PRI-105-01",r:5,t:"mc",d:2,tag:"Rapid Response",obj:"Identify criteria for calling a rapid response",
s:"Which client finding warrants activating the rapid response team?",
o:["SBP 102 mm Hg (baseline 108 mm Hg)","RR 30/min with new confusion and SpO2 88% on 2 L/min","HR 98/min","Pain 8/10 after surgery"],a:1,
x:["A minor change. Within the client's usual range.","Correct. Tachypnea, hypoxia despite oxygen, and new confusion meet RRT criteria.","Upper normal.","Treat the pain. It does not meet RRT criteria by itself."],
c:"Multiple acute abnormalities + mental status change.",p:"Call the RRT for acute deterioration before arrest.",
st:"RRT answer = acute change in breathing, circulation, or mental status.",pl:"The RRT exists to PREVENT codes. Call early. 'Nurse is worried' is a valid trigger.",
tr:["COMFORT","Severe pain is distressing, but it is not a deterioration criterion."]});

q({id:"PRI-105-02",r:5,t:"mc",d:3,tag:"Deterioration",obj:"Respond to opioid-induced respiratory depression",
s:"A client using a morphine PCA has an RR of 8/min, is difficult to arouse, and has an SpO2 of 86%. What is the nurse's first action?",
o:["Administer naloxone IV as prescribed","Stop the PCA infusion","Document the findings","Notify the health care provider"],a:1,
x:["Naloxone is very likely next, but morphine is still infusing while you prepare it.","Correct. Stop the source first (seconds), stimulate the client, and support breathing. Then give naloxone and notify.","Documentation never comes first in an emergency.","Necessary, but after immediate interventions."],
c:"The drug is still infusing.",p:"Remove the cause: stop the infusion.",
st:"Stop → Support → Reverse → Report.",pl:"Naloxone: titrate small doses to restore breathing without causing severe pain or withdrawal. Monitor, as it may wear off before the opioid does.",
tr:["TRUEBUT","Naloxone is the antidote, so it is tempting. Stopping the PCA is the faster first step."]});

q({id:"PRI-105-03",r:5,t:"sata",d:3,tag:"Deterioration",obj:"Early warning signs",
s:"Which findings are early warning signs of clinical deterioration? Select all that apply.",
o:["RR increased from 16 to 26/min over 4 hours","New restlessness and agitation","Urine output 15 mL/hr","Chronic bilateral ankle edema","Temperature 37.1°C (98.8°F)"],a:[0,1,2],
x:["Correct. A rising RR is the earliest and most sensitive sign of deterioration.","Correct. A new mental status change often signals hypoxia or poor perfusion.","Correct. Low urine output = kidneys are underperfused.","Chronic and stable.","Normal."],
c:"Trends and new changes.",p:"Catch deterioration in the hours before arrest.",
st:"Early warning = respiratory rate, mental status, urine output.",pl:"Most in-hospital arrests have warning signs 6–8 hours earlier. Count the RR for a full minute.",
tr:["CHRONIC","Ankle edema looks like a finding to report, but it is chronic and stable."]});

q({id:"PRI-105-04",r:5,t:"mc",d:2,tag:"Emergency",obj:"Treat severe hypoglycemia safely",
s:"A client with type 1 diabetes is found unresponsive with a fingerstick glucose of 42 mg/dL. The client has a patent IV. What should the nurse do first?",
o:["Give 4 oz of orange juice","Administer 50% dextrose IV per protocol","Recheck the glucose in 15 minutes","Call the health care provider"],a:1,
x:["Never give oral fluids to an unresponsive client: aspiration risk.","Correct. An unresponsive client with IV access needs IV dextrose (glucagon IM if no IV).","Delays treatment of a neuro-threatening low.","Treat first per protocol, then notify."],
c:"Unresponsive + IV access.",p:"Treat severe hypoglycemia immediately. Route depends on consciousness.",
st:"Unconscious client = nothing by mouth.",pl:"Rule of 15: 15 g fast carbs → recheck in 15 min (for an ALERT client). Unresponsive: IV D50 or glucagon.",
tr:["ASSESS","Rechecking seems careful, but the brain is starving NOW."]});

q({id:"PRI-105-05",r:5,t:"mc",d:4,tag:"Rapid Response",obj:"Recognize sepsis or anastomotic leak after surgery",
s:"A 68-year-old client is 2 days post-colectomy. Assessment: HR 122/min, RR 26/min, temperature 38.6°C (101.5°F), BP 94/58 mm Hg (baseline 136/82), new confusion, urine output 20 mL/hr, rigid abdomen. What is the nurse's priority action?",
o:["Activate the rapid response team","Administer acetaminophen and recheck the temperature in 1 hour","Increase the IV rate and document the findings","Encourage incentive spirometer use every hour"],a:0,
x:["Correct. Signs of sepsis and possible anastomotic leak or peritonitis with hypoperfusion. Needs a rapid team response, sepsis bundle, and likely surgical evaluation.","Treats the number, not the problem.","Changing the IV rate without an order and only documenting delays care.","Good for atelectasis, but this client is in shock."],
c:"Rigid abdomen + SIRS signs + hypotension + low output.",p:"Multiple-system deterioration = escalate immediately.",
st:"When the stem piles up abnormal vitals and new confusion, the answer is escalation.",pl:"Anastomotic leak typically appears on post-op days 2–5: fever, abdominal pain or rigidity, tachycardia, sepsis.",
tr:["TRUEBUT","Acetaminophen treats the fever, but the fever is just one piece of a shock picture."]});

q({id:"PRI-105-06",r:5,t:"mc",d:3,tag:"Deterioration",obj:"Recognize fat embolism syndrome",
s:"Thirty-six hours after repair of a femur fracture, a client suddenly becomes confused, has petechiae on the chest, and SpO2 drops to 85%. What is the nurse's priority action?",
o:["Apply high-flow oxygen and call the rapid response team","Reorient the client and raise the side rails","Administer the PRN lorazepam for agitation","Massage the affected leg to improve circulation"],a:0,
x:["Correct. The classic triad (respiratory distress, neurological change, petechiae) = fat embolism syndrome. Support oxygenation and escalate.","Confusion here is from hypoxia. Reorientation won't fix it.","Sedation can mask neuro changes and depress breathing.","Never massage. It risks dislodging clots or emboli."],
c:"Long-bone fracture + 24–72 h + petechiae + hypoxia + confusion.",p:"Respiratory compromise → oxygen and escalation.",
st:"Confusion in a post-op client is hypoxia until proven otherwise.",pl:"Fat embolism: 24–72 h after a long-bone fracture. Petechiae on the chest, axilla, and conjunctiva are a unique clue.",
tr:["COMFORT","Treating the agitation seems kind, but the confusion is caused by hypoxia."]});

q({id:"PRI-105-07",r:5,t:"mc",d:1,tag:"Deterioration",obj:"The most sensitive vital sign trend",
s:"Which vital sign trend over 4 hours is most concerning for clinical deterioration?",
o:["HR 88 → 92/min","BP 130/80 → 124/78 mm Hg","RR 18 → 28/min","Temperature 37.0 → 37.4°C"],a:2,
x:["A minimal change.","A minimal change.","Correct. A rising RR is the most sensitive early indicator of deterioration (hypoxia, acidosis, sepsis).","A minimal change."],
c:"RR change of 10/min.",p:"Respiratory rate is the earliest warning sign.",
st:"Compare the magnitude of change for each vital sign.",pl:"RR >24 is a red flag in most early warning scores.",
tr:["NUMBER","The BP change looks like a 'drop', but it is tiny. The RR change is the big one."]});

q({id:"PRI-105-08",r:5,t:"rank",d:3,tag:"Emergency",obj:"Sequence the response to cardiac arrest",
s:"The nurse witnesses a client become unresponsive. The client has no pulse and is not breathing normally. Rank the nurse's actions in order.",
o:["Call for help and activate the emergency response system","Begin high-quality chest compressions","Attach the defibrillator pads as soon as the AED or defibrillator arrives","Document the event and the times of interventions"],a:[0,1,2,3],
x:["1st – Get help and the defibrillator coming.","2nd – Compressions immediately: 100–120/min, at least 2 inches deep.","3rd – Shock shockable rhythms ASAP. Minimize pauses.","4th – Documentation happens after (a recorder documents during the code)."],
c:"Pulseless + not breathing = cardiac arrest.",p:"Activate → compress → defibrillate.",
st:"In arrest questions, documentation and calling family are always last.",pl:"Push hard (≥2 in), push fast (100–120/min), full recoil, minimize interruptions to under 10 s.",
tr:["LEAVE","Running to get the AED yourself leaves the client without compressions. Call for it."]});

q({id:"PRI-105-09",r:5,t:"mc",d:3,tag:"Deterioration",obj:"Recognize increasing ICP",
s:"A client with a head injury had a GCS of 14 at the start of the shift. The GCS is now 10, and the right pupil is newly dilated and sluggish. What should the nurse do first?",
o:["Notify the provider or rapid response team immediately","Recheck the neurological assessment in 1 hour","Administer acetaminophen for the reported headache","Place the client flat in bed"],a:0,
x:["Correct. A GCS drop of 2 or more plus a unilateral pupil change = rising ICP, possible herniation. Emergency.","Waiting allows herniation to progress.","Does not address rising ICP.","The head of bed should be 30° to promote venous drainage. Flat raises ICP."],
c:"GCS drop + unilateral dilated pupil.",p:"A neuro decline is an emergency. Escalate immediately.",
st:"A 'recheck later' option is almost never right with an acute neuro change.",pl:"Rising ICP: decreased LOC (earliest), pupil changes. Cushing's triad (late): widening pulse pressure, bradycardia, irregular respirations.",
tr:["ASSESS","Rechecking sounds thorough, but the change has already been confirmed. Act now."]});

q({id:"PRI-105-10",r:5,t:"cloze",d:4,tag:"Sepsis",obj:"Apply the sepsis bundle",
s:"A client with suspected sepsis has a lactate of 4.2 mmol/L. The nurse recognizes that this indicates {0} and anticipates {1}. Blood cultures should be drawn {2} antibiotics are started.",
o:[["tissue hypoperfusion","normal metabolism","dehydration only"],["a 30 mL/kg crystalloid bolus","fluid restriction","oral fluids only"],["before","after"]],a:[0,0,0],
x:["Lactate ≥4 = anaerobic metabolism from hypoperfusion (high risk).","Surviving Sepsis: 30 mL/kg crystalloid for hypotension or lactate ≥4.","Cultures before antibiotics improve organism identification, but never delay antibiotics significantly."],
c:"Lactate ≥4.",p:"Hour-1 bundle: lactate, cultures, antibiotics, fluids, vasopressors if MAP <65.",
st:"Know the sepsis numbers: lactate ≥2 abnormal, ≥4 severe; MAP goal ≥65.",pl:"MAP = (SBP + 2×DBP) ÷ 3. Goal ≥65 mm Hg.",
tr:["ASSESS","'Dehydration only' minimizes a lactate that signals shock-level hypoperfusion."]});

/* ---------- ROOM 106: SAFETY & FIRST VS BEST ---------- */
q({id:"PRI-106-01",r:6,t:"mc",d:1,tag:"Safety",obj:"Fall prevention",
s:"Which action is the priority for preventing falls in a confused older adult?",
o:["Keep the bed low and locked with the call light within reach","Apply wrist restraints","Raise all four side rails","Request a sedative at bedtime"],a:0,
x:["Correct. The least restrictive, most effective first-line measures.","Restraints are a last resort and increase injury risk.","Four rails up counts as a restraint and increases falls from climbing over.","Sedation increases fall risk."],
c:"Least restrictive.",p:"Use the least restrictive safety measure first.",
st:"Restraint-like options are rarely correct unless all else has failed.",pl:"Fall bundle: bed low, wheels locked, call light, nonslip socks, scheduled toileting, bed alarm.",
tr:["DELEGATE","Side rails feel protective, but four rails up is a restraint and causes falls."]});

q({id:"PRI-106-02",r:6,t:"mc",d:1,tag:"Safety",obj:"Seizure safety",
s:"A client begins having a generalized tonic-clonic seizure in bed. What is the nurse's first action?",
o:["Turn the client to the side and protect the head","Insert a padded tongue blade","Restrain the client's limbs","Administer an oral anticonvulsant"],a:0,
x:["Correct. Side-lying keeps the airway clear and prevents aspiration. Cushion the head and move hazards away.","Never put anything in the mouth. It risks broken teeth and airway injury.","Restraining can cause fractures and soft-tissue injury.","Nothing by mouth during a seizure."],
c:"Active seizure.",p:"Protect the airway and prevent injury. Never restrain or put anything in the mouth.",
st:"Eliminate anything that goes IN the mouth or HOLDS DOWN the body.",pl:"Time the seizure. Over 5 minutes = status epilepticus → IV benzodiazepine (lorazepam).",
tr:["TRUEBUT","A tongue blade seems to protect the airway, but it actually causes injury and obstruction."]});

q({id:"PRI-106-03",r:6,t:"mc",d:2,tag:"Safety",obj:"Fire response (RACE)",
s:"The nurse discovers a fire in a client's room. The client is in bed. What should the nurse do first?",
o:["Activate the fire alarm","Remove the client from the room","Close all doors on the unit","Use the fire extinguisher"],a:1,
x:["Second (Alarm).","Correct. RACE: Rescue first when the client is in immediate danger.","Third (Contain).","Fourth (Extinguish), only if the fire is small and safe to fight."],
c:"Client in the room with the fire.",p:"RACE: Rescue, Alarm, Contain, Extinguish.",
st:"Know the order of the acronym, and remember that people come before property.",pl:"PASS for the extinguisher: Pull, Aim at the base, Squeeze, Sweep.",
tr:["TRUEBUT","Pulling the alarm is essential, but the person in immediate danger comes first."]});

q({id:"PRI-106-04",r:6,t:"mc",d:1,tag:"Safety",obj:"Blood transfusion safety",
s:"Before hanging packed red blood cells, which action is most important?",
o:["Verify the client's identity and the blood product with another licensed nurse at the bedside","Warm the blood in a microwave","Prime the tubing with D5W","Premedicate every client with diphenhydramine"],a:0,
x:["Correct. Two-person bedside verification prevents ABO-incompatible transfusion, the deadliest error.","Never microwave blood. Use an approved blood warmer if needed.","Only 0.9% NaCl. Dextrose causes hemolysis.","Premedication is per order, not routine."],
c:"Most important = prevent the fatal error.",p:"Patient identification is the top transfusion safety step.",
st:"For 'most important' safety questions, pick the one that prevents death.",pl:"Transfusion: 0.9% NaCl only, filter tubing, start within 30 min of pickup, finish within 4 h, stay for the first 15 min.",
tr:["TRUEBUT","Premedication sounds safe, but it is not routine, and identity verification prevents the deadliest error."]});

q({id:"PRI-106-05",r:6,t:"mc",d:3,tag:"High-Alert Meds",obj:"Respond to heparin over-anticoagulation",
s:"A client on a continuous heparin infusion has an aPTT of 145 seconds (therapeutic 60–100 seconds per protocol) and bleeding gums. What should the nurse do first?",
o:["Stop the heparin infusion","Administer protamine sulfate","Notify the health care provider","Repeat the aPTT"],a:0,
x:["Correct. Stop the source of excess anticoagulation immediately, then follow the protocol and notify.","Protamine requires an order and is not always needed. Stopping the infusion comes first.","Next step, after stopping the drip.","The client is already bleeding. Repeating the lab delays action."],
c:"Supratherapeutic aPTT + active bleeding.",p:"Stop the cause first.",
st:"For drug toxicity with symptoms, 'stop the drug' is usually first.",pl:"Heparin: monitor aPTT or anti-Xa and platelets (watch for HIT). Antidote: protamine sulfate.",
tr:["CALL","Notifying is correct, but you can stop the infusion yourself right now."]});

q({id:"PRI-106-06",r:6,t:"sata",d:3,tag:"Safety",obj:"Neutropenic precautions",
s:"A client has an absolute neutrophil count of 400/mm³. Which actions should the nurse include? Select all that apply.",
o:["Place the client in a private room","Perform strict hand hygiene before entering","Remove fresh flowers and live plants from the room","Take temperatures rectally for accuracy","Allow visitors with cold symptoms if they wear a mask"],a:[0,1,2],
x:["Correct. Reduces exposure.","Correct. The single most effective prevention measure.","Correct. Standing water and soil harbor organisms.","Contraindicated: mucosal injury and infection risk.","Visitors with any illness should not visit."],
c:"ANC <500 = severe neutropenia.",p:"Protective precautions for the immunocompromised.",
st:"Neutropenia: anything that introduces organisms or breaks the skin or mucosa is wrong.",pl:"ANC = WBC × (% neutrophils + % bands). Below 500 = severe. Fever = emergency.",
tr:["NUMBER","Rectal temps are 'more accurate', which is tempting, but accuracy never beats infection risk."]});

q({id:"PRI-106-07",r:6,t:"mc",d:3,tag:"First vs Best",obj:"First action for suspected ACS",
s:"A client with a history of CAD reports crushing chest pain. BP 136/80 mm Hg, HR 96/min, SpO2 96% on room air. The provider has prescribed oxygen PRN for SpO2 <90%, a 12-lead ECG, and morphine IV PRN. What should the nurse do first?",
o:["Apply oxygen at 4 L/min","Obtain the 12-lead ECG","Administer morphine IV","Prepare the client for discharge teaching"],a:1,
x:["SpO2 is 96%. Oxygen is not indicated (prescribed for SpO2 <90%), and routine oxygen is not recommended without hypoxemia.","Correct. A 12-lead ECG within 10 minutes identifies STEMI and drives time-critical treatment.","Morphine is not first-line and may mask symptoms. Use it for pain unrelieved by nitrates.","Not appropriate."],
c:"SpO2 96% = no oxygen needed. ECG within 10 min.",p:"Diagnose quickly. Time is muscle.",
st:"Read the parameters on the orders. They often eliminate options.",pl:"ACS: ECG within 10 min, aspirin (chewed), nitroglycerin if SBP is adequate, troponin, door-to-balloon ≤90 min.",
tr:["NUMBER","'MONA' habits make oxygen tempting, but the SpO2 is normal."]});

q({id:"PRI-106-08",r:6,t:"mc",d:2,tag:"Medication Safety",obj:"Respond to a client's medication concern",
s:"While receiving medications, a client says, 'That pill looks different from the one I take at home.' What should the nurse do first?",
o:["Hold the medication and verify it against the provider's order and MAR","Reassure the client that it is probably a generic","Administer it and check afterward","Document that the client refused the medication"],a:0,
x:["Correct. A client's concern is a safety cue. Stop and verify before giving.","False reassurance. It could be an error.","Unsafe. A possible error would reach the client.","The client did not refuse. They raised a concern."],
c:"The client questions the medication.",p:"Always verify when a client questions a medication.",
st:"When a client questions a medication, the answer is to stop and check.",pl:"Rights of medication administration include the right to refuse and the right to education.",
tr:["COMFORT","Reassurance sounds client-centered, but it is false reassurance and unsafe."]});

q({id:"PRI-106-09",r:6,t:"mc",d:3,tag:"Safety",obj:"Restraint safety",
s:"The nurse checks a client in soft wrist restraints. Which finding requires immediate correction?",
o:["Restraints are tied to the side rails","Two fingers fit under each restraint","Circulation and skin were checked per policy","The restraint order was renewed within the required time frame"],a:0,
x:["Correct. Tying to a side rail can injure the client when the rail is lowered. Tie to the bed frame with a quick-release knot.","Correct technique.","Correct technique.","Correct. Orders are time-limited."],
c:"Location of the tie.",p:"Restraint safety: bed frame, quick-release knot, two fingers, frequent checks.",
st:"'Requires correction' = find the one thing done WRONG.",pl:"Restraints are never PRN. They need an order with a time limit, and release, ROM, and toileting at regular intervals.",
tr:["EXPECT","The other options mention checks and orders, which may seem like problems, but all are correctly done."]});

q({id:"PRI-106-10",r:6,t:"mc",d:4,tag:"Infection Safety",obj:"Airborne precautions for suspected TB",
s:"A client with a 3-week cough, night sweats, and hemoptysis is waiting in a busy hallway for a bed. What should the nurse do first?",
o:["Place a surgical mask on the client and move the client to an airborne infection isolation room","Place an N95 respirator on the client","Collect a sputum specimen for acid-fast bacilli","Administer the first dose of antituberculosis medication"],a:0,
x:["Correct. Source control (surgical mask on the client) plus a negative-pressure room protects others immediately.","N95s are for STAFF. Clients wear a surgical mask for source control.","Needed, but protecting others comes first.","Requires diagnosis and prescription. Not first."],
c:"Classic TB symptoms in a crowded area.",p:"Contain transmission first.",
st:"Infection questions: protect others before diagnosing or treating.",pl:"TB = airborne: negative-pressure room, N95 for staff, surgical mask on the client during transport. Three sputum AFB samples.",
tr:["TRUEBUT","An N95 sounds more protective, but it is for staff. The client wears a surgical mask."]});

/* ---------- BOSS POOL: THE CHAOS COMMANDER (difficult, separate from room questions) ---------- */
q({id:"PRI-BOSS-01",r:"B",t:"mc",d:4,tag:"Stable vs Unstable",obj:"Prioritize acute pulmonary edema",
s:"At the start of the shift, which client should the nurse assess first?",
o:["72-year-old with heart failure, SpO2 91% on 2 L/min, coughing up pink frothy sputum","Client 1 day post-TKA in a CPM machine, pain 6/10","Client with DKA on an insulin infusion, glucose 240 mg/dL, potassium 3.8 mEq/L","Client with pneumonia, temperature 38.4°C, RR 20/min, alert"],a:0,
x:["Correct. Pink frothy sputum = acute pulmonary edema, a breathing emergency even though the SpO2 isn't critically low yet.","Expected post-op pain on a stable client.","Glucose is falling appropriately and K is normal. The infusion is on track.","Febrile but stable vitals and mentation."],
c:"Pink frothy sputum.",p:"A specific symptom of an acute emergency can outrank a numerically worse value.",
st:"Read the descriptive words, not just the numbers.",pl:"Acute pulmonary edema: high Fowler's with legs dependent, O2, IV loop diuretic, nitrates; consider BiPAP.",
tr:["NUMBER","SpO2 91% isn't dramatic, but pink frothy sputum means the lungs are flooding."]});

q({id:"PRI-BOSS-02",r:"B",t:"mc",d:3,tag:"Delegation",obj:"UAP scope in stroke care",
s:"The nurse is caring for a client 2 days after an ischemic stroke. Which task is appropriate to delegate to the UAP?",
o:["Measure and record the daily weight","Perform the bedside swallow screen","Teach the client to use a quad cane","Assess the heels for early skin breakdown"],a:0,
x:["Correct. Routine measurement with standard procedure.","A swallow screen requires nursing assessment and judgment.","Teaching = RN (PT also teaches assistive devices).","Assessment = RN."],
c:"Routine, standardized, stable.",p:"UAP: measurements and ADLs. RN: assessment, teaching, screening.",
st:"Screens, checks of new function, and teaching are RN tasks even when they seem simple.",pl:"Stroke: dysphagia screen before ANY oral intake, including meds.",
tr:["DELEGATE","A swallow screen looks like a quick bedside task, but it is an assessment that determines aspiration risk."]});

q({id:"PRI-BOSS-03",r:"B",t:"mc",d:4,tag:"Emergency",obj:"Treat unstable tachydysrhythmia",
s:"A client in atrial fibrillation with a ventricular rate of 156/min suddenly reports chest pain and dizziness. BP 78/42 mm Hg, cool clammy skin. Which intervention should the nurse anticipate?",
o:["Synchronized cardioversion","Oral metoprolol","Unsynchronized defibrillation","Adenosine 6 mg rapid IV push"],a:0,
x:["Correct. A tachydysrhythmia with a pulse that makes the client hemodynamically unstable (hypotension, chest pain, altered perfusion) = synchronized cardioversion.","Oral medication is far too slow for an unstable client.","Defibrillation is for pulseless VT/VF. This client has a pulse, so shock must be synchronized to avoid R-on-T.","Adenosine is for stable narrow-complex SVT, not AFib."],
c:"Has a pulse + unstable.",p:"Unstable with a pulse → synchronized shock. Pulseless → defibrillate.",
st:"First decide stable vs unstable, then pulse vs no pulse.",pl:"Before cardioversion: sedate if possible and press 'sync'. Anticoagulation concerns if AFib >48 h, but instability overrides.",
tr:["TRUEBUT","Rate control is correct for STABLE AFib, but this client is unstable."]});

q({id:"PRI-BOSS-04",r:"B",t:"sata",d:4,tag:"Expected vs Unexpected",obj:"Post-thyroidectomy complications",
s:"Six hours after a total thyroidectomy, which findings require immediate intervention? Select all that apply.",
o:["Inspiratory stridor","Facial twitching when the cheek is tapped","Blood pooling on the linen behind the neck","Mild hoarseness that is unchanged since surgery","Incisional pain 4/10"],a:[0,1,2],
x:["Correct. Airway obstruction.","Correct. Positive Chvostek sign = hypocalcemia, which can progress to laryngospasm.","Correct. Bleeding drains posteriorly. Check behind the neck. A hematoma can compress the airway.","Expected and stable. Report if it worsens.","Expected and controlled."],
c:"Stridor, Chvostek, posterior bleeding.",p:"Know the 3 complications: airway, bleeding, hypocalcemia.",
st:"For SATA, test each option against 'Is this a complication or expected?'",pl:"Check the dressing AND behind the neck after neck surgery. Gravity pulls blood back.",
tr:["EXPECT","Hoarseness sounds alarming, but mild and unchanged is expected. Worsening is not."]});

q({id:"PRI-BOSS-05",r:"B",t:"mc",d:4,tag:"Lab Priority",obj:"Respond to severe hyperkalemia",
s:"A client with ESRD who missed dialysis has a potassium of 6.8 mEq/L and peaked T waves on the monitor strip. What should the nurse do first?",
o:["Initiate continuous cardiac monitoring and notify the provider immediately","Administer sodium polystyrene sulfonate","Redraw the potassium to rule out hemolysis","Teach the client to avoid high-potassium foods"],a:0,
x:["Correct. ECG changes confirm a real, dangerous potassium level. Continuous monitoring plus immediate notification for emergency treatment (IV calcium, insulin with dextrose, dialysis).","Too slow for an emergency, and needs an order.","Peaked T waves confirm the value is real. Redrawing delays treatment.","Important later, not in an emergency."],
c:"K 6.8 + ECG changes.",p:"Treat the risk of fatal dysrhythmia first.",
st:"When an ECG change matches a lab, the lab is real. Act now.",pl:"Hyperkalemia emergency order: calcium gluconate (protect heart) → insulin + dextrose, albuterol (shift) → binders, diuretics, dialysis (remove). 'C BIG K Drop'.",
tr:["ASSESS","Redrawing seems reasonable for a high K, but the ECG already confirms it."]});

q({id:"PRI-BOSS-06",r:"B",t:"mc",d:4,tag:"Emergency",obj:"Chest tube disconnection",
s:"A client's chest tube becomes disconnected from the drainage system. The client is breathing comfortably. What is the nurse's first action?",
o:["Clamp the chest tube close to the chest","Submerge the end of the chest tube 2–3 cm in a bottle of sterile water","Notify the health care provider","Clean the ends and reconnect the same tubing"],a:1,
x:["Clamping can cause a tension pneumothorax because air can't escape. Avoid it unless specifically prescribed.","Correct. Creates an immediate water seal: air can exit but can't re-enter. Then set up a new system.","Do it after the immediate safety step.","The system is now contaminated. Use a new system."],
c:"Disconnected = lost water seal.",p:"Restore a one-way seal immediately.",
st:"Chest tube emergencies: restore the seal, don't clamp.",pl:"Keep sterile water and a dressing at the bedside. If the tube is pulled OUT, cover with a sterile dressing taped on 3 sides.",
tr:["TRUEBUT","Clamping feels like 'stopping the problem', but it can trap air and cause tension pneumothorax."]});

q({id:"PRI-BOSS-07",r:"B",t:"matrix",d:4,tag:"Sepsis",obj:"Sepsis bundle actions (NGN matrix)",
s:"A client has suspected septic shock. For each action, indicate whether it is INDICATED or NOT INDICATED at this time.",
cols:["Indicated","Not indicated"],
o:["Obtain blood cultures before antibiotics","Administer broad-spectrum antibiotics within 1 hour","Wait for culture results before starting antibiotics","Administer 30 mL/kg crystalloid for hypotension","Restrict IV fluids to prevent edema"],a:[0,0,1,0,1],
x:["Indicated. Cultures first, without delaying antibiotics.","Indicated. Each hour of delay increases mortality.","Not indicated. Cultures take 24–72 h. Start empiric antibiotics.","Indicated. Restores perfusion.","Not indicated. Fluid resuscitation is needed for hypoperfusion."],
c:"Septic shock = time-critical bundle.",p:"Hour-1 sepsis bundle.",
st:"For each row, ask 'Does this speed up or delay treatment?'",pl:"Vasopressor of choice if MAP stays <65 after fluids: norepinephrine.",
tr:["ASSESS","Waiting for culture results seems precise, but it delays life-saving antibiotics."]});

q({id:"PRI-BOSS-08",r:"B",t:"mc",d:4,tag:"Emergency",obj:"Autonomic dysreflexia first action",
s:"A client with a T4 spinal cord injury reports a pounding headache and nasal congestion. BP 214/112 mm Hg, HR 52/min, face flushed above the injury. What should the nurse do first?",
o:["Raise the head of the bed to a sitting position","Check the bladder for distention","Administer the PRN antihypertensive","Notify the health care provider"],a:0,
x:["Correct. Sitting up (legs down if possible) lowers BP immediately by pooling blood in the lower extremities. It takes seconds.","The next step: find and remove the trigger (bladder is the most common).","Used only if BP stays high after removing the trigger.","Done after immediate actions."],
c:"Injury at T6 or above + severe hypertension + bradycardia + headache.",p:"Lower the BP fast, then remove the stimulus.",
st:"When two answers are both correct, choose the one that works fastest and safest.",pl:"Autonomic dysreflexia causes: bladder (most common), bowel, tight clothing, skin pressure. Sit up → loosen clothes → check bladder → bowel → meds.",
tr:["TRUEBUT","Checking the bladder treats the cause, so it's tempting, but sitting up lowers a stroke-level BP immediately."]});

q({id:"PRI-BOSS-09",r:"B",t:"mc",d:4,tag:"Transfusion",obj:"Acute hemolytic transfusion reaction",

q({id:"PRI-BOSS-12",r:"B",t:"mc",d:4,tag:"High-Alert Meds",obj:"Potassium before insulin in DKA",
s:"A client with DKA has received 1 L of 0.9% NaCl. Labs: glucose 520 mg/dL, potassium 3.1 mEq/L, pH 7.18. An insulin infusion is prescribed. What should the nurse do first?",
o:["Start the insulin infusion","Administer IV potassium replacement as prescribed before starting insulin","Administer sodium bicarbonate","Switch the IV fluid to D5W"],a:1,
x:["Insulin shifts K into cells. Starting insulin with K <3.3 can cause fatal hypokalemia.","Correct. Replace potassium first when K <3.3, then start insulin.","Bicarbonate is not routine at pH 7.18 (generally considered only for pH <6.9).","Dextrose is added when glucose falls to about 200–250 mg/dL, not now."],
c:"K 3.1 before insulin.",p:"Prevent iatrogenic hypokalemia.",
st:"Look at EVERY lab in the stem. One of them changes the 'obvious' answer.",pl:"DKA order: fluids → check K → insulin (if K ≥3.3) → add dextrose at about 200–250 → monitor K hourly.",
tr:["TRUEBUT","Insulin is the core DKA treatment, but this K makes it dangerous to start right now."]});

q({id:"PRI-BOSS-14",r:"B",t:"mc",d:3,tag:"Medication Safety",obj:"Lactulose therapeutic effect",

q({id:"PRI-BOSS-15",r:"B",t:"mc",d:4,tag:"Lab Priority",obj:"Recognize diabetes insipidus",

q({id:"PRI-BOSS-16",r:"B",t:"sata",d:4,tag:"High-Alert Meds",obj:"Respond to suspected HIT",

q({id:"PRI-BOSS-17",r:"B",t:"mc",d:3,tag:"Teaching",obj:"Oxygen in COPD",

q({id:"PRI-BOSS-18",r:"B",t:"cloze",d:4,tag:"ABGs",obj:"Interpret an ABG",
s:"A client's ABG: pH 7.30, PaCO2 58 mm Hg, HCO3 26 mEq/L. The nurse interprets this as {0} that is {1}. The priority nursing action is to {2}.",
o:[["respiratory acidosis","metabolic acidosis","respiratory alkalosis"],["uncompensated","partially compensated","fully compensated"],["assess for hypoventilation and support ventilation","give sodium bicarbonate","have the client breathe into a paper bag"]],a:[0,0,0],
x:["pH low (acidosis) + PaCO2 high (respiratory) = respiratory acidosis.","HCO3 26 is normal (22–26): the kidneys haven't compensated = uncompensated.","Treat the cause: improve ventilation (position, cough, deep breathing, reverse sedation, NIV if needed). Bicarbonate is for metabolic acidosis; a paper bag is for alkalosis."],
