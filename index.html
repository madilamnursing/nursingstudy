q({id:"PRI-BOSS-19",r:"B",t:"mc",d:4,tag:"Emergency",obj:"Compartment syndrome",
s:"A client with a casted forearm fracture reports severe pain unrelieved by IV morphine. Pain increases when the nurse passively extends the fingers, and the fingers are pale. What should the nurse do?",
o:["Elevate the arm above the level of the heart","Apply ice packs over the cast","Notify the provider immediately and prepare for cast bivalving or fasciotomy","Administer another dose of morphine"],a:2,
x:["Elevating ABOVE the heart reduces arterial flow in compartment syndrome. Keep it at heart level.","Ice may further compromise perfusion once compartment syndrome is suspected.","Correct. Compartment syndrome is a limb-threatening emergency. Pressure must be relieved within hours.","Pain out of proportion is the warning sign. Masking it delays treatment."],
c:"Pain out of proportion + pain with passive stretch.",p:"Compartment syndrome = emergency. Escalate.",
st:"Elevation is right for most injuries, but NOT above heart level for compartment syndrome.",pl:"The 6 Ps: Pain (first, out of proportion), Pressure, Paresthesia, Pallor, Paralysis, Pulselessness (late).",
tr:["TRUEBUT","Elevation is a common correct answer for fractures, but here it worsens perfusion."]});

q({id:"PRI-BOSS-20",r:"B",t:"mc",d:3,tag:"Lab Priority",obj:"Critical lab in pancreatitis",

q({id:"PRI-BOSS-21",r:"B",t:"mc",d:4,tag:"Medication Safety",obj:"Hold nitroglycerin in hypotension",
s:"A client with an inferior wall MI reports chest pain 6/10. BP 86/54 mm Hg, HR 58/min, clear lungs, JVD present. Sublingual nitroglycerin is prescribed PRN. What should the nurse do?",
o:["Withhold the nitroglycerin and notify the provider","Administer the nitroglycerin and recheck the BP in 5 minutes","Administer morphine instead","Place the client in high Fowler's position"],a:0,
x:["Correct. SBP <90 is a contraindication. An inferior MI with hypotension, clear lungs, and JVD suggests right ventricular infarction, which is preload-dependent. Nitrates can cause profound hypotension.","Nitrates drop preload and BP further.","Morphine also lowers BP and preload.","Upright positioning can worsen hypotension."],
c:"SBP <90 + inferior MI + JVD with clear lungs.",p:"Know when to HOLD a prescribed medication.",
st:"Check parameters before giving any cardiac med: BP, HR, and recent PDE-5 inhibitor use.",pl:"RV infarct: give IV fluids to support preload. Avoid nitrates, morphine, and diuretics.",
tr:["TRUEBUT","Nitroglycerin is a cornerstone of chest pain treatment, but this BP makes it dangerous."]});

q({id:"PRI-BOSS-22",r:"B",t:"mc",d:4,tag:"Emergency",obj:"BP management before thrombolysis",
s:"A client with an acute ischemic stroke arrives 90 minutes after symptom onset and is a candidate for alteplase. BP 196/112 mm Hg. What should the nurse anticipate first?",
o:["Administering an IV antihypertensive to lower BP below 185/110 mm Hg before alteplase","Administering alteplase immediately","Administering aspirin 325 mg","Rapidly lowering BP to 120/80 mm Hg"],a:0,
x:["Correct. BP must be <185/110 before alteplase (and <180/105 after) to lower hemorrhage risk.","Giving alteplase with uncontrolled BP increases intracranial hemorrhage risk.","Aspirin is held for 24 h after thrombolytics.","Over-aggressive lowering reduces cerebral perfusion to the penumbra."],
c:"Alteplase candidate + BP above threshold.",p:"Meet safety criteria before a high-risk therapy.",
st:"Look for the precise numeric threshold. Too much or too little lowering are both traps.",pl:"Alteplase: BP <185/110 before, <180/105 for 24 h after. Neuro checks frequently. No anticoagulants or antiplatelets for 24 h.",
tr:["NUMBER","'Normal' BP sounds ideal, but dropping too far starves the brain."]});

q({id:"PRI-BOSS-23",r:"B",t:"mc",d:3,tag:"Oncologic Emergency",obj:"Neutropenic fever",
s:"A client receiving chemotherapy has an ANC of 300/mm³ and a temperature of 38.3°C (101°F). The client feels 'fine'. What is the nurse's priority?",
o:["Obtain blood cultures and administer prescribed broad-spectrum antibiotics within 1 hour","Give acetaminophen and recheck the temperature in 1 hour","Encourage oral fluids and rest","Place the client in contact isolation"],a:0,
x:["Correct. Neutropenic fever is an oncologic emergency. Infection can become septic shock rapidly with few signs.","Delays treatment.","Supportive, not definitive.","Protective (neutropenic) precautions are used, not contact isolation."],
c:"ANC <500 + temperature ≥38.0°C.",p:"Neutropenic fever = sepsis until proven otherwise.",
st:"'Feels fine' is a distractor. Neutropenic clients can't mount typical signs.",pl:"Neutropenic clients may not show pus, redness, or infiltrates. Fever may be the ONLY sign.",
tr:["ASSESS","'Feels fine' tempts you to wait, but neutropenia hides infection signs."]});

q({id:"PRI-BOSS-24",r:"B",t:"mc",d:4,tag:"Oncologic Emergency",obj:"Recognize tumor lysis syndrome",
s:"Two days after starting induction chemotherapy for leukemia, a client's labs show potassium 6.2 mEq/L, phosphorus elevated, calcium 7.4 mg/dL, uric acid elevated, and urine output has decreased. What should the nurse anticipate?",
o:["Notify the provider and prepare for aggressive IV hydration and cardiac monitoring","Restrict fluids to prevent fluid overload","Administer calcium supplements orally","Continue routine monitoring; these are expected chemotherapy effects"],a:0,

st:"A cluster of electrolyte changes after cell destruction = think TLS.",pl:"TLS: 'Three highs and a low': K, phosphorus, uric acid up; calcium down.",
tr:["EXPECT","Chemo does cause lab changes, but this cluster is an emergency, not routine."]});

/* ---------- Storage with safe fallback (private mode / sandboxed frames) ---------- */
const Store = (() => {
  const mem = {};
  let ok = false;
  try { localStorage.setItem("__hh", "1"); localStorage.removeItem("__hh"); ok = true; } catch (e) { ok = false; }
  return {

    del(k) { try { if (ok) localStorage.removeItem(k); delete mem[k]; } catch (e) { delete mem[k]; } }

})();
const SLOT_KEY = n => "hesiHeroes_slot_" + n;

function newSave(name, look) {

function loadSlot(n) { const raw = Store.get(SLOT_KEY(n)); if (!raw) return null; try { return migrate(JSON.parse(raw)); } catch (e) { return null; } }

  const base = newSave(s.name || "Nurse", s.look || defaultLook());

/* render(q, host, opts) — opts: {header, monitor, noFeedback, onSubmit(result), onNext, nextLabel, shortFeedback} */
function evaluate(q, resp) {
  if (q.t === "mc") return { ok: resp === q.a };

function drawBossArena(dt) {

  g.fillStyle = "#2a1a4a"; g.fillRect(0, h * .78, w, h * .22);

  const bx = w * .7, by = h * .45;

  drawCommander(g, bx, by, s, 0, { flash: B.flash > .5, heal: B.heal > .2, shake: B.shake > 0 && !S.settings.reduced });
  if (B.heal > 0) { g.fillStyle = "rgba(91,224,138," + B.heal + ")"; g.font = "900 " + 26 * s + "px system-ui"; g.textAlign = "center"; for (let i = 0; i < 5; i++) g.fillText("+", bx - 80 * s + i * 40 * s, by - 60 * s - (1 - B.heal) * 60 * s - i * 6); }
  const px = w * .2, py = h * .82; const mode = B.shots.length ? "celebrate" : B.heal > 0 ? "sad" : "";
  drawNurse(g, px, py, S.look, "right", 0, mode, 4.4 * s);
  for (let i = B.shots.length - 1; i >= 0; i--) {
    const sh = B.shots[i]; sh.t += dt * 1.8; const x = px + (bx - px) * sh.t, y = py - 60 * s + (by - py + 60 * s) * sh.t - Math.sin(sh.t * Math.PI) * 60 * s;
    g.fillStyle = sh.sp ? "#ffd54a" : "#7fd4ff"; g.beginPath(); g.arc(x, y, (sh.sp ? 16 : 10) * s, 0, 7); g.fill(); g.fillStyle = "#fff"; g.beginPath(); g.arc(x, y, 4 * s, 0, 7); g.fill();

  }
  for (let i = B.floats.length - 1; i >= 0; i--) { const f = B.floats[i]; f.t += dt; if (f.t > 1.3) { B.floats.splice(i, 1); continue; } g.globalAlpha = 1 - f.t / 1.3; g.fillStyle = f.col; g.font = "900 " + 34 * s + "px system-ui"; g.textAlign = "center"; g.strokeStyle = "#000"; g.lineWidth = 5; g.strokeText(f.txt, bx, by - 90 * s - f.t * 50); g.fillText(f.txt, bx, by - 90 * s - f.t * 50); g.globalAlpha = 1; }
}

  creatorEdit = edit; draft = edit ? { ...S.look } : defaultLook(); $("#create").classList.remove("hidden"); $("#cName").value = edit ? S.name : ""; $("#cGo").textContent = edit ? "💾 Save look" : "Start my shift ▶"; $("#cCoins").textContent = edit ? "🪙 " + S.coins + " coins: unlock 🔒 items" : "🔒 items unlock with coins you earn in-game"; renderCreator();
}
function renderCreator() {
  const host = $("#cOpts"); host.innerHTML = "";
  Object.keys(OPT).forEach(k => {
    const o = OPT[k]; const g = el("div", "opt-group", "<h4>" + o.label + "</h4>"); const w = el("div", "swatches"); g.appendChild(w);
    optItems(k).forEach((it, i) => {
      const lk = isLocked(k, i); const cost = o.locked && o.locked[i]; let b;
      if (o.type === "sw") { b = el("button", "sw" + (draft[k] === i ? " sel" : "")); b.style.background = it === "galaxy" ? "linear-gradient(135deg,#2b1055,#7597de,#d16ba5)" : it; b.setAttribute("aria-label", o.label + " " + (i + 1)); }
      else b = el("button", "pill" + (draft[k] === i ? " sel" : ""), esc(it));
      if (lk) b.appendChild(el("span", "lock", o.special && o.special[i] ? "🏆" : "🔒" + cost));
      b.onclick = () => {
        Snd.fx("tap");
        if (lk) { if (o.special && o.special[i]) { toast("🏆 Earned by: " + ACH.find(a => a.id === o.special[i]).d); return; } if (!creatorEdit) { toast("Earn coins in-game to unlock this item"); return; } if (S.coins < cost) { toast("Need 🪙" + cost + " (you have " + S.coins + ")"); return; } askYes("Unlock this item for 🪙" + cost + "?", () => { S.coins -= cost; S.owned.push(k + ":" + i); save(); Snd.fx("unlock"); toast("🛍️ Unlocked!"); $("#cCoins").textContent = "🪙 " + S.coins + " coins"; draft[k] = i; renderCreator(); }); return; }
        draft[k] = i; renderCreator();
      };
      w.appendChild(b);
    });
    host.appendChild(g);
  });
  const c = $("#cPrev"); c.width = 320; c.height = 400;
  if (!renderCreator.loop) { renderCreator.loop = true; (function anim() { if ($("#create").classList.contains("hidden")) { renderCreator.loop = false; return; } const x = c.getContext("2d"); x.setTransform(2, 0, 0, 2, 0, 0); x.clearRect(0, 0, 160, 200); if (!running) T = performance.now() / 1000; drawNurse(x, 80, 192, draft, "down", 0, (Math.floor(T / 2.5) % 3 === 2) ? "celebrate" : "", 6); requestAnimationFrame(anim); })(); }
}
function creatorDone() {
  const nm = ($("#cName").value || "").trim().slice(0, 18) || "Nurse Hero";
  if (creatorEdit) { S.look = { ...draft }; S.name = nm; save(); $("#create").classList.add("hidden"); hudUpdate(); toast("✨ Looking sharp!"); return; }
  S = newSave(nm, { ...draft }); save(); $("#create").classList.add("hidden"); enterGame(true);
}

/* ===================== GAME ENTRY & LOOP ===================== */
let running = false;
function enterGame(isNew) {
  $("#start").classList.add("hidden"); $("#create").classList.add("hidden"); $("#hud").classList.remove("hidden");
  applySettings(); scene = "hospital"; P.x = 190; P.y = 420; P.dir = "down"; computeCam(); running = true; hudUpdate(); touchStreak(); save();
  setHint("Tap a unit or the HESI Tower • drag to look around");
  if (isNew) setTimeout(() => dialog("Gus at Reception", "Welcome to <b>Med-Surg Heroes Hospital</b>, " + esc(S.name) + "! 🏥 Your first assignment is the <b>Prioritization Command Center</b>, the glowing purple unit. Tap its door and your nurse will walk there. Wrong answers are part of learning: every mistake becomes a lesson.", [{ t: "Let's go! ▶", c: "good", f: () => { const b = WORLD.hospital.blocks[0]; walkTo(b.stand.x, b.stand.y, () => activateBlock(b)); } }]), 500);
  else if (S.active && S.active.type === "room") setTimeout(() => dialog("Resume?", "You were in the middle of Room " + ROOMS[S.active.room - 1].num + " (question " + (S.active.i + 1) + "/" + S.active.order.length + ").", [{ t: "Discard", c: "ghost", f: () => { S.active = null; save(); } }, { t: "Resume ▶", c: "good", f: () => { scene = "unit"; startRoom(S.active.room, true); } }]), 400);
}
let lastT = performance.now(), beepT = 0;
function loop(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; T += dt;
  if (running) {
    if (P.moodT > 0) P.moodT -= dt;
    updatePlayer(dt); updateNPCs(dt);
    const prev = cam.x; computeCam(); if (manualCam && !P.walking) { const vw = VW / cam.s; cam.x = clamp(prev, Math.min(0, -(vw - W().W) / 2), Math.max(0, W().W - vw)); } else manualCam = 0;
    if (fadeDir === 1) { fade += dt * 4; if (fade >= 1) { fade = 1; const f = fadeCb; fadeCb = null; fadeDir = -1; f && f(); computeCam(); } } else if (fadeDir === -1) { fade -= dt * 4; if (fade <= 0) { fade = 0; fadeDir = 0; } }
    if (fadeCb && S.settings.reduced) { const f = fadeCb; fadeCb = null; f(); }
    render();
    if (B && !$("#boss").classList.contains("hidden")) drawBossArena(dt);
    if (EX) examTick();
  }
  requestAnimationFrame(loop);
}
$("#hMenu").onclick = () => { Snd.fx("tap"); mainMenu(); };
$("#hSnd").onclick = () => { S.settings.sound = !S.settings.sound; if (!S.settings.sound) Snd.music(false); else Snd.music(S.settings.music); save(); hudUpdate(); };
$("#hVault").onclick = () => vaultView();
$("#hAv").onclick = () => dashboard();
$("#cGo").onclick = creatorDone;
$("#cRand").onclick = () => { Object.keys(OPT).forEach(k => { let i; let guard = 0; do { i = rnd(optItems(k).length); } while (isLocked(k, i) && guard++ < 20); draft[k] = isLocked(k, i) ? 0 : i; }); if (draft.body === 0) draft.fhair = 0; else if (Math.random() < .5) draft.fhair = 0; renderCreator(); };
$("#cBack").onclick = () => { $("#create").classList.add("hidden"); if (!creatorEdit) { $("#start").classList.remove("hidden"); initStart(); } };
initStart(); requestAnimationFrame(loop);
window.HH = { get S() { return S; }, P, evaluate, QMAP, ACTIVE_Q, WORLD, get B() { return B; }, levelInfo, startRoom, startBoss, activateBlock, walkTo, get scene() { return scene; } };

/* ===================== CLOUD SAVE (Claude account, when the page runs inside Claude) ===================== */
const Cloud = (() => {
  let db = null, uid = null, ready = false, timer = null, writing = false, again = false;
  const lastPushed = {};
  const ref = n => db.collection("data/users/" + uid).doc("slot" + n);
  function setChip(state) {
    const c = $("#hCloud"); if (!c) return;
    c.classList.remove("hidden");
    c.textContent = state === "ok" ? "☁️✓" : state === "saving" ? "☁️…" : "☁️!";
    c.title = state === "ok" ? "Saved to your Claude account" : state === "saving" ? "Saving to your account…" : "Cloud save unavailable: saved on this device only";
  }
  async function init() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!d || !u) return;
      const id = await u.id(); if (!id) return;
      db = d; uid = id;
      const snap = await Promise.race([db.collection("data/users/" + uid).get(), new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 10000))]);
      let changed = false, newestSlot = 0, newestT = 0;
      snap.docs.forEach(doc => {
        if (!doc.exists) return; const m = /^slot(\d)$/.exec(doc.id); if (!m) return; const n = +m[1]; const body = doc.data();
        if (!body || typeof body.data !== "string") return;
        lastPushed[n] = body.data;
        const local = loadSlot(n);
        if (body.deleted) { if (local && (local.updated || 0) <= (body.updated || 0)) { Store.del(SLOT_KEY(n)); changed = true; } return; }
        if (body.updated > newestT) { newestT = body.updated; newestSlot = n; }
        if (!local || (body.updated || 0) > (local.updated || 0)) { if (!(running && n === SLOT)) { Store.set(SLOT_KEY(n), body.data); changed = true; } }
      });
      ready = true; setChip("ok");
      if (newestSlot && (!+Store.get("hesiHeroes_last") || changed)) Store.set("hesiHeroes_last", String(newestSlot));
      if (changed && !running) { initStart(); toast("☁️ Your saved game was loaded from your Claude account"); }
      // push any local slots the cloud doesn't have yet
      for (const n of [1, 2, 3]) { const raw = Store.get(SLOT_KEY(n)); if (raw && raw !== lastPushed[n]) { const s = loadSlot(n); const cloudT = snap.docs.find(d => d.id === "slot" + n); if (!cloudT || !cloudT.exists || (s && s.updated > (cloudT.data().updated || 0))) await push(n); } }
      const st = $("#cloudNote"); if (st) st.textContent = "☁️ Cloud save is ON: progress saves to your Claude account automatically.";
    } catch (e) { db = null; ready = false; }
  }
  async function push(n) {
    if (!db || !uid) return;
    const raw = Store.get(SLOT_KEY(n)); if (!raw || raw === lastPushed[n]) return;
    let s; try { s = JSON.parse(raw); } catch (e) { return; }
    if (writing) { again = true; return; }
    writing = true; setChip("saving");
    try { await ref(n).set({ data: raw, updated: s.updated || Date.now(), name: s.name || "", xp: s.xp || 0 }); lastPushed[n] = raw; setChip("ok"); }
    catch (e) {
      if (e && e.code === "unavailable") { setTimeout(() => queue(), 3000 + Math.random() * 2000); }
      else setChip("err");
    }
    writing = false; if (again) { again = false; queue(); }
  }
  function queue() { if (!db) return; clearTimeout(timer); timer = setTimeout(() => push(SLOT), 2500); }
  function flush() { if (!db) return; clearTimeout(timer); push(SLOT); }
  async function remove(n) { if (!db) return; try { await ref(n).set({ data: "", deleted: true, updated: Date.now() }); lastPushed[n] = ""; } catch (e) { } }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
  addEventListener("pagehide", flush);
  setTimeout(init, 0);
  return { queue, flush, remove, get on() { return ready; } };
})();

/* ===================== SUPABASE ACCOUNTS + CLOUD SAVE (for your own website) =====================
   Turns on only when window.HH_SUPABASE.url and .key are filled in (see the setup block at the top of the file).
   Table expected: public.saves (user_id uuid, slot int, data jsonb, updated_at bigint), row-level security on. */
const Supa = (() => {
  const cfg = window.HH_SUPABASE || {};
  const enabled = !!(cfg.url && cfg.key);
  let sb = null, user = null, writing = false, again = false, timer = null, failed = false;
  const last = {};
  function chip(state) {
    const c = $("#hCloud"); if (!c) return; c.classList.remove("hidden");
    c.textContent = state === "ok" ? "☁️✓" : state === "saving" ? "☁️…" : "☁️!";
    c.title = state === "ok" ? "Saved to your account" : state === "saving" ? "Saving to your account…" : "Couldn't reach your account: saved on this device and will retry";
  }
  function loadLib() {
    return new Promise((res, rej) => {
      if (window.supabase && window.supabase.createClient) return res();
      const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      s.onload = () => res(); s.onerror = () => rej(new Error("lib")); document.head.appendChild(s);
    });
  }
  function startUI() {
    const b = $("#btnAcct"); if (!b) return;
    if (!enabled) { b.classList.add("hidden"); return; }
    b.classList.remove("hidden");
    b.textContent = failed ? "☁️ Accounts offline (playing on this device)" : user ? "☁️ Signed in: " + (user.email || "account") : "☁️ Sign in to Save";
    const n = $("#cloudNote"); if (n) n.textContent = user ? "☁️ Cloud save is ON: your progress follows your account on any device." : "";
  }
  async function init() {
    startUI(); if (!enabled) return;
    try {
      await loadLib();
      sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      const { data } = await sb.auth.getSession();
      await setUser(data && data.session ? data.session.user : null);
      sb.auth.onAuthStateChange((ev, session) => { setUser(session ? session.user : null); if (ev === "PASSWORD_RECOVERY") setTimeout(newPassword, 300); });
    } catch (e) { failed = true; sb = null; startUI(); }
  }
  async function setUser(u) {
    const was = user && user.id; user = u || null; startUI();
    if (user && user.id !== was) await pull();
  }
  async function pull() {
    if (!sb || !user) return;
    const { data, error } = await sb.from("saves").select("slot,data,updated_at");
    if (error) { chip("err"); return; }
    let changed = false;
    for (const r of data || []) {
      if (!r || !r.data || r.data.deleted) continue;
      const local = loadSlot(r.slot), raw = JSON.stringify(r.data);
      if (!local || (r.updated_at || 0) > (local.updated || 0)) {
        if (!(running && r.slot === SLOT)) { Store.set(SLOT_KEY(r.slot), raw); last[r.slot] = raw; changed = true; }
      }
    }
    for (const n of [1, 2, 3]) {
      const raw = Store.get(SLOT_KEY(n)); if (!raw) continue;
      const r = (data || []).find(x => x.slot === n); let lu = 0; try { lu = JSON.parse(raw).updated || 0; } catch (e) { }
      if (!r || lu > (r.updated_at || 0)) await push(n); else last[n] = raw;
    }
    chip("ok");
    if (changed && !running) { const newest = (data || []).filter(r => r.data && !r.data.deleted).sort((a, b) => b.updated_at - a.updated_at)[0]; if (newest) Store.set("hesiHeroes_last", String(newest.slot)); initStart(); toast("☁️ Your progress was loaded from your account"); }
  }
  async function push(n) {
    if (!sb || !user) return;
    const raw = Store.get(SLOT_KEY(n)); if (!raw || raw === last[n]) return;
    if (writing) { again = true; return; }
    writing = true; chip("saving");
    try {
      const s = JSON.parse(raw);
      const { error } = await sb.from("saves").upsert({ user_id: user.id, slot: n, data: s, updated_at: s.updated || Date.now() }, { onConflict: "user_id,slot" });
      if (error) throw error; last[n] = raw; chip("ok");
    } catch (e) { chip("err"); setTimeout(queue, 15000); }
    writing = false; if (again) { again = false; queue(); }
  }
  function queue() { if (!sb || !user) return; clearTimeout(timer); timer = setTimeout(() => push(SLOT), 2500); }
  function flush() { if (!sb || !user) return; clearTimeout(timer); push(SLOT); }
  async function remove(n) { if (!sb || !user) return; try { await sb.from("saves").delete().eq("slot", n); delete last[n]; } catch (e) { } }
  async function removeAll() { if (!sb || !user) return false; const { error } = await sb.from("saves").delete().eq("user_id", user.id); return !error; }
  function accountModal(msg) {
    if (!enabled) return;
    if (failed || !sb) { openModal('<h2>☁️ Accounts</h2><p>Couldn\'t reach the account service right now (offline?). You can still play: progress saves on this device and syncs after you sign in later.</p><button class="good" style="width:100%" onclick="closeModal()">OK</button>'); return; }
    if (user) {
      openModal('<div class="mhead"><h2>☁️ Your account</h2><button class="ghost" id="ax">✕</button></div><p>Signed in as <b>' + esc(user.email || "") + '</b>. Every answer saves to your account automatically, so open this site on any device and sign in to keep going.</p>' +
        '<div class="qact"><button class="ghost grow" id="aout">Sign out</button></div><h3>Privacy</h3><p class="small">Only your email and game progress are stored.</p><button class="bad" id="adel">Delete my cloud saves</button>',
        c => {
          c.querySelector("#ax").onclick = closeModal;
          c.querySelector("#aout").onclick = async () => { flush(); await sb.auth.signOut(); user = null; closeModal(); startUI(); toast("Signed out. Progress on this device is kept."); };
          c.querySelector("#adel").onclick = () => askYes("Delete all of your cloud saves? Saves on this device are kept.", async () => { const ok = await removeAll(); toast(ok ? "🗑️ Cloud saves deleted" : "Couldn't delete right now. Try again later."); for (const k in last) delete last[k]; });
        });
      return;
    }
    openModal('<div class="mhead"><h2>☁️ Sign in or create an account</h2><button class="ghost" id="ax">✕</button></div><p class="small">Free. Saves your nurse and progress so you can play on any device.</p>' +
      (msg ? '<div class="box pearl">' + msg + "</div>" : "") +
      '<input id="aem" type="email" placeholder="Email" autocomplete="email" style="width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid #ccd;margin:6px 0">' +
      '<input id="apw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" style="width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid #ccd;margin:6px 0">' +
      '<div class="qact"><button class="good grow" id="ain">Sign in</button><button class="blue grow" id="aup">Create account</button></div><button class="ghost" id="afg" style="width:100%;margin-top:8px">Forgot password?</button><p class="small" id="amsg"></p>',
      c => {
        const em = () => c.querySelector("#aem").value.trim(), pw = () => c.querySelector("#apw").value, say = t => c.querySelector("#amsg").textContent = t;
        c.querySelector("#ax").onclick = closeModal;
        c.querySelector("#ain").onclick = async () => { say("Signing in…"); const { error } = await sb.auth.signInWithPassword({ email: em(), password: pw() }); if (error) say("❌ " + error.message); else { closeModal(); toast("☁️ Signed in: cloud save is on"); } };
        c.querySelector("#aup").onclick = async () => { if (pw().length < 6) { say("Password needs at least 6 characters."); return; } say("Creating account…"); const { data, error } = await sb.auth.signUp({ email: em(), password: pw(), options: { emailRedirectTo: location.origin + location.pathname } }); if (error) say("❌ " + error.message); else if (data && data.session) { closeModal(); toast("🎉 Account created: cloud save is on"); } else say("📧 Check your email and tap the confirmation link, then come back and sign in."); };
        c.querySelector("#afg").onclick = async () => { if (!em()) { say("Type your email first."); return; } const { error } = await sb.auth.resetPasswordForEmail(em(), { redirectTo: location.origin + location.pathname }); say(error ? "❌ " + error.message : "📧 Password reset email sent."); };
      });
  }
  function newPassword() {
    openModal('<h2>🔑 Choose a new password</h2><input id="np" type="password" placeholder="New password (6+ characters)" style="width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid #ccd;margin:6px 0"><button class="good" id="nps" style="width:100%">Save password</button><p class="small" id="npm"></p>',
      c => c.querySelector("#nps").onclick = async () => { const p = c.querySelector("#np").value; if (p.length < 6) { c.querySelector("#npm").textContent = "At least 6 characters."; return; } const { error } = await sb.auth.updateUser({ password: p }); if (error) c.querySelector("#npm").textContent = "❌ " + error.message; else { closeModal(); toast("🔑 Password updated"); } });
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
  addEventListener("pagehide", flush);
  setTimeout(init, 0);
  return { queue, flush, remove, accountModal, get on() { return !!(sb && user); }, get enabled() { return enabled; } };
})();
</script>
